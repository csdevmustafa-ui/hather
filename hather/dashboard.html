<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم | Hather</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --g1:#0b3a2a;
      --g2:#145c42;
      --g3:#1f8a5b;
      --card:#1a6b4b;
      --card2:#145c42;
      --text:#ecfff7;
      --muted:#bfe7d6;
      --accent:#6ee7b7;
      --danger:#ff6b6b;
    }

    *{box-sizing:border-box;font-family:"Segoe UI",Tahoma,Arial,sans-serif}

    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));
      color:var(--text);
    }

    header{
      padding:20px 26px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:22px;
      font-weight:700;
    }

    .logout{
      background:rgba(255,255,255,.12);
      border:none;
      color:var(--text);
      padding:8px 14px;
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
    }

    .container{
      padding:20px;
      max-width:1100px;
      margin:auto;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:18px;
    }

    .card{
      background:linear-gradient(160deg,var(--card),var(--card2));
      border-radius:18px;
      padding:20px;
      box-shadow:0 16px 40px rgba(0,0,0,.25);
    }

    .card h2{
      margin:0 0 10px;
      font-size:18px;
    }

    .card p{
      margin:0;
      font-size:14px;
      color:var(--muted);
    }

    .big{
      font-size:34px;
      font-weight:800;
      margin-top:10px;
      color:var(--accent);
    }

    .section{
      margin-top:28px;
    }

    .section h3{
      margin-bottom:12px;
      font-size:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:linear-gradient(160deg,var(--card),var(--card2));
      border-radius:16px;
      overflow:hidden;
      font-size:14px;
    }

    th,td{
      padding:12px;
      text-align:center;
    }

    th{
      background:rgba(0,0,0,.15);
      color:#dffaf0;
      font-weight:600;
    }

    tr:nth-child(even){
      background:rgba(255,255,255,.04);
    }

    .empty{
      padding:18px;
      text-align:center;
      color:var(--muted);
    }

    .footer{
      text-align:center;
      margin:30px 0 10px;
      font-size:12px;
      color:#b7e3d1;
    }
  </style>
</head>

<body>

<header>
  <h1>لوحة التحكم – عضو هيئة التدريس</h1>
  <button class="logout" onclick="logout()">تسجيل الخروج</button>
</header>

<div class="container">

  <!-- إحصائيات سريعة -->
  <div class="grid">
    <div class="card">
      <h2>عدد المحاضرات</h2>
      <p>إجمالي المحاضرات المسجلة</p>
      <div class="big" id="lecturesCount">0</div>
    </div>

    <div class="card">
      <h2>عدد الطلاب</h2>
      <p>طلاب مسجلون في النظام</p>
      <div class="big" id="studentsCount">0</div>
    </div>

    <div class="card">
      <h2>نسبة الحضور</h2>
      <p>متوسط الحضور العام</p>
      <div class="big">—%</div>
    </div>
  </div>

  <!-- جدول المحاضرات -->
  <div class="section">
    <h3>المحاضرات</h3>

    <table>
      <thead>
        <tr>
          <th>LectureID</th>
          <th>المقرر</th>
          <th>الشعبة</th>
          <th>البداية</th>
          <th>النهاية</th>
        </tr>
      </thead>
      <tbody id="lecturesTable">
        <tr>
          <td colspan="5" class="empty">لا توجد محاضرات بعد</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<div class="footer">
  Hather Attendance System © 2026
</div>

<script>
  // تسجيل خروج
  function logout(){
    window.location.href = "doctor.html";
  }

  // مبدئياً أرقام تجريبية (تربطها بالـ API لاحقاً)
  document.getElementById("lecturesCount").innerText = 1;
  document.getElementById("studentsCount").innerText = 0;

  // مثال تحميل محاضرة (شكل فقط)
  const tbody = document.getElementById("lecturesTable");
  tbody.innerHTML = `
    <tr>
      <td>L1770473077502</td>
      <td>CS111</td>
      <td>1</td>
      <td>07/02/2026 17:04</td>
      <td>21/02/2026 17:04</td>
    </tr>
  `;
</script>

</body>
</html>
