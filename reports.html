<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hather - Reports</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{
    min-height:100vh;
    background: linear-gradient(135deg,#0d2c1a 0%, #1a472a 45%, #2d7d46 100%);
    display:flex;align-items:center;justify-content:center;
    padding:20px;color:#fff;
  }
  .wrap{
    width:100%;max-width:560px;border-radius:18px;padding:22px;
    background: rgba(13, 44, 26, 0.78);
    box-shadow: 0 18px 45px rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .icon-btn{
    width:42px;height:42px;border-radius:12px;border:none;cursor:pointer;
    background: rgba(255,255,255,.12);color:#fff;font-size:18px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
  }
  .back{color:#d6ffe9;text-decoration:none;font-weight:900;opacity:.9}
  .header{text-align:center;padding-bottom:14px;margin-bottom:16px;position:relative}
  .header::after{
    content:'';position:absolute;bottom:0;left:15%;right:15%;height:2px;
    background: linear-gradient(to right, transparent, rgba(76,201,135,.95), transparent);
  }
  .title{
    font-size:42px;font-weight:900;
    background: linear-gradient(135deg, #b9ffd9, #4cc987);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{margin-top:6px;font-size:16px;font-weight:900;color:#d6ffe9;opacity:.95}
  label{display:block;margin:14px 0 6px;font-weight:900;color: rgba(255,255,255,.92)}
  input{
    width:100%;padding:14px;border-radius:12px;border:2px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.92);font-size:17px;color:#0d2c1a;direction:ltr;
  }
  button.primary{
    width:100%;margin-top:14px;padding:16px 14px;border:none;border-radius:14px;cursor:pointer;
    color:#fff;font-weight:900;font-size:18px;
    background: linear-gradient(135deg,#1a472a,#2d7d46,#4cc987);
  }
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
  .stat{
    border-radius:14px;padding:12px;
    background: rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.10);
    text-align:center
  }
  .stat .n{font-size:26px;font-weight:900;margin-top:6px}
  .msg{min-height:22px;margin-top:12px;text-align:center;font-weight:900}
  canvas{background: rgba(255,255,255,.08);border-radius:14px;padding:10px;margin-top:14px}
</style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html" id="backHome">↩ الرئيسية</a>
    <button class="icon-btn" id="langBtn" title="Language">🌐</button>
  </div>

  <div class="header">
    <div class="title">Hather</div>
    <div class="subtitle" id="subTitle">تقارير الطالب</div>
  </div>

  <label id="lblId">الرقم الجامعي</label>
  <input id="studentId" maxlength="9" inputmode="numeric" placeholder="441234567" />
  <button class="primary" id="btn">عرض التقرير</button>

  <div class="stats">
    <div class="stat"><div id="pLbl">حضور</div><div class="n" id="pN">0</div></div>
    <div class="stat"><div id="lLbl">تأخير</div><div class="n" id="lN">0</div></div>
    <div class="stat"><div id="aLbl">غياب</div><div class="n" id="aN">0</div></div>
    <div class="stat"><div id="eLbl">معذور</div><div class="n" id="eN">0</div></div>
  </div>

  <div class="msg" id="msg"></div>
  <canvas id="pie"></canvas>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjIB2ICWitmLIvaHb7eIUhiGPZhKWES6vnsNZUrpQR45pNQh-ZMzMLMy3mid3kFx0/exec";

  const STR = {
    ar:{dir:"rtl",lang:"ar",back:"↩ الرئيسية",sub:"تقارير الطالب",lbl:"الرقم الجامعي",btn:"عرض التقرير",
        p:"حضور",l:"تأخير",a:"غياب",e:"معذور",inv:"❌ الرقم الجامعي لازم 9 أرقام",load:"⏳ جاري التحميل...",fail:"❌ فشل الاتصال"},
    en:{dir:"ltr",lang:"en",back:"↩ Home",sub:"Student Reports",lbl:"University ID",btn:"View report",
        p:"Present",l:"Late",a:"Absent",e:"Excused",inv:"❌ University ID must be 9 digits",load:"⏳ Loading...",fail:"❌ Connection failed"}
  };

  function getLang(){ return localStorage.getItem("hather_lang") || "ar"; }
  function setLang(l){ localStorage.setItem("hather_lang", l); }
  function applyLang(){
    const t = STR[getLang()];
    document.documentElement.lang = t.lang;
    document.documentElement.dir = t.dir;
    backHome.textContent = t.back;
    subTitle.textContent = t.sub;
    lblId.textContent = t.lbl;
    btn.textContent = t.btn;
    pLbl.textContent = t.p; lLbl.textContent = t.l; aLbl.textContent = t.a; eLbl.textContent = t.e;
  }
  langBtn.onclick = ()=>{ setLang(getLang()==="ar"?"en":"ar"); applyLang(); };
  applyLang();

  let pieChart=null;

  function draw(p,l,a,e){
    if(pieChart) pieChart.destroy();
    pieChart = new Chart(document.getElementById("pie"),{
      type:"doughnut",
      data:{
        labels:[STR[getLang()].p, STR[getLang()].l, STR[getLang()].a, STR[getLang()].e],
        datasets:[{ data:[p,l,a,e] }]
      },
      options:{ plugins:{ legend:{ labels:{ color:"#eafff3" } } } }
    });
  }

  btn.addEventListener("click", ()=>{
    const t = STR[getLang()];
    const id = studentId.value.trim();
    if(!/^\d{9}$/.test(id)){ msg.style.color="salmon"; msg.textContent=t.inv; return; }

    msg.style.color="#d6ffe9"; msg.textContent=t.load;

    fetch(`${SCRIPT_URL}?studentId=${id}`)
      .then(r=>r.json())
      .then(d=>{
        if(!d.ok) throw new Error();
        pN.textContent=d.present||0;
        lN.textContent=d.late||0;
        aN.textContent=d.absent||0;
        eN.textContent=d.excused||0;
        msg.style.color="#7CFFB2"; msg.textContent="✅";
        draw(d.present||0,d.late||0,d.absent||0,d.excused||0);
      })
      .catch(()=>{ msg.style.color="salmon"; msg.textContent=t.fail; });
  });
</script>
</body>
</html>
