<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports - Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=1">
  <script src="assets/app.js?v=1"></script>
</head>
<body>

<div class="container">
  <div class="glass topbar">
    <div class="brand">
      <div class="logo">📊</div>
      <div class="brandTitle">
        <h1 data-i18n="reports">التقارير</h1>
        <p data-i18n="app_name">Hather</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn" href="index.html"><span data-i18n="back_home">الرئيسية</span></a>
      <a class="btn" href="student-report.html"><span data-i18n="student_report">تقرير الطالب</span></a>
      <a class="btn" href="doctor.html"><span data-i18n="doctor">عضو هيئة التدريس</span></a>
    </div>
  </div>

  <div class="grid">
    <div class="glass card" style="margin-top:16px;">
      <h2 data-i18n="course_report">تقرير المقرر</h2>

      <label data-i18n="pin">كلمة المرور (PIN)</label>
      <input class="input" id="pin" type="password" data-i18n-ph="pin_placeholder" placeholder="أدخل PIN" />
      <div style="height:10px"></div>

      <label data-i18n="course">المقرر</label>
      <input class="input" id="course" placeholder="CS111" />

      <div style="height:12px"></div>
      <button class="btn primary" onclick="loadCourse()"><span data-i18n="view">عرض</span></button>
      <div class="status" id="st"></div>

      <div class="hr"></div>

      <div class="tableWrap">
        <table style="min-width:700px">
          <thead>
            <tr>
              <th data-i18n="student_id">الرقم الجامعي</th>
              <th>Name</th>
              <th data-i18n="present">حضور</th>
              <th data-i18n="late">تأخير</th>
              <th data-i18n="absent">غياب</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" data-i18n="no_data">لا توجد بيانات</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="glass card" style="margin-top:16px;">
      <h2>روابط</h2>
      <a class="btn primary" href="student.html"><span data-i18n="student">الطالب</span></a>
      <a class="btn" href="student-report.html"><span data-i18n="student_report">تقرير الطالب</span></a>
      <a class="btn" href="doctor.html"><span data-i18n="doctor">عضو هيئة التدريس</span></a>
      <div class="hr"></div>
      <p style="margin:0;color:rgba(255,255,255,.72);font-size:12px;line-height:1.7;">
        يتم تحديد اللغة من الصفحة الرئيسية.
      </p>
    </div>
  </div>

  <div class="footer">Hather Attendance System © 2026</div>
</div>

<script>
  HATHER.applyI18n();
  const $ = HATHER.qs;

  function show(type,msg){
    const s=$("st"); s.className="status show "+(type||""); s.textContent=msg||"";
  }
  function hide(){ const s=$("st"); s.className="status"; s.textContent=""; }

  async function loadCourse(){
    hide();
    const doctorKey = ($("pin").value||"").trim();
    const course = ($("course").value||"").trim();
    if(!doctorKey){ show("bad","PIN"); return; }
    if(!course){ show("bad","Course"); return; }

    try{
      const res = await HATHER.apiPost({ action:"courseReport", doctorKey, course });
      if(!res || !res.ok){
        show("bad", (res && res.error) ? res.error : "Failed");
        return;
      }
      const rows = res.rows || [];
      const tb = $("rows");
      if(rows.length===0){
        tb.innerHTML = `<tr><td colspan="5">${HATHER.t("no_data")}</td></tr>`;
        return;
      }
      tb.innerHTML = rows.map(r=>`
        <tr>
          <td>${r.studentId||""}</td>
          <td>${r.name||""}</td>
          <td>${r.present||0}</td>
          <td>${r.late||0}</td>
          <td>${r.absent||0}</td>
        </tr>
      `).join("");
      show("ok","OK");
    }catch(e){
      show("bad", HATHER.t("api_error"));
    }
  }
</script>

</body>
</html>
