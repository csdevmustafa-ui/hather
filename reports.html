<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports - Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=3">
  <script src="assets/app.js?v=3"></script>
</head>
<body>

<div class="container">
  <div class="glass topbar">
    <div class="brand">
      <div class="logo">📊</div>
      <div class="brandTitle">
        <h1 data-i18n="reports">التقارير</h1>
        <p>طالب + مقرر (للدكتور)</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn" href="index.html"><span data-i18n="back_home">الرئيسية</span></a>
      <a class="btn" href="student-report.html"><span data-i18n="student_report">تقرير الطالب</span></a>
    </div>
  </div>

  <div class="grid">
    <div class="glass card" style="margin-top:16px;">
      <h2 data-i18n="course_report">تقرير مقرر</h2>
      <label>PIN (Doctor)</label>
      <input class="input" id="pin" placeholder="PIN" type="password" />
      <div style="height:10px"></div>

      <label>Course</label>
      <input class="input" id="course" placeholder="مثال: CS111" />
      <div style="height:10px"></div>

      <button class="btn primary" onclick="loadCourse()">عرض</button>
      <div class="status" id="st"></div>

      <div class="hr"></div>

      <div class="tableWrap">
        <table style="min-width:700px">
          <thead>
            <tr>
              <th>StudentID</th>
              <th>Name</th>
              <th>Present</th>
              <th>Late</th>
              <th>Absent</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5">اكتب PIN + Course ثم اضغط عرض.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="glass card" style="margin-top:16px;">
      <h2>روابط سريعة</h2>
      <a class="btn primary" href="student-report.html">تقرير الطالب</a>
      <a class="btn" href="doctor.html">واجهة الدكتور</a>
      <a class="btn" href="student.html">واجهة الطالب</a>
      <div class="hr"></div>
      <p style="margin:0;color:rgba(255,255,255,.72);font-size:12px;line-height:1.7;">
        اللغة تُحدد من الصفحة الرئيسية فقط.
      </p>
    </div>
  </div>

  <div class="footer">Hather Attendance System © 2026</div>
</div>

<script>
  HATHER.applyI18n();
  const $ = HATHER.qs;

  function show(type,msg){
    const st=$("st"); st.className="status show "+(type||""); st.textContent=msg||"";
  }
  function hide(){ const st=$("st"); st.className="status"; st.textContent=""; }

  async function loadCourse(){
    hide();
    const doctorKey = ($("pin").value||"").trim();
    const course = ($("course").value||"").trim();
    if(!doctorKey){ show("bad","اكتب PIN"); return; }
    if(!course){ show("bad","اكتب Course"); return; }

    try{
      const res = await HATHER.apiPost({ action:"courseReport", doctorKey, course });
      if(!res || !res.ok){
        show("bad", (res && res.error) ? res.error : "Failed");
        return;
      }
      const rows = res.rows || [];
      const tb = $("rows");
      if(rows.length===0){
        tb.innerHTML = `<tr><td colspan="5">لا توجد بيانات</td></tr>`;
        return;
      }
      tb.innerHTML = rows.map(r=>`
        <tr>
          <td>${r.studentId||""}</td>
          <td>${r.name||""}</td>
          <td>${r.present||0}</td>
          <td>${r.late||0}</td>
          <td>${r.absent||0}</td>
        </tr>
      `).join("");
      show("ok","تم ✅");
    }catch(e){
      show("bad", HATHER.t("error_api"));
    }
  }
</script>

</body>
</html>
