<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة عضو هيئة التدريس</title>

<style>
:root{
  --g1:#0f3d2e;
  --g2:#145a3a;
  --g3:#1f8a5b;
  --card:#1a6f4a;
  --soft:#e9fff5;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
  font-family:"Segoe UI",Tahoma,Arial;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.card{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#1d7a52,#155a3c);
  border-radius:22px;
  padding:28px;
  box-shadow:0 30px 60px rgba(0,0,0,.35);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.lang-btn{
  background:rgba(255,255,255,.15);
  border:none;
  color:#fff;
  padding:6px 14px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
}

h1{
  font-size:22px;
  margin:0 0 6px 0;
  font-weight:700;
}

.subtitle{
  font-size:14px;
  color:#dff7ec;
  margin-bottom:22px;
}

.field{
  margin-bottom:18px;
}

.label{
  font-size:14px;
  margin-bottom:6px;
  display:block;
}

.pass-wrap{
  display:flex;
  align-items:center;
  background:var(--soft);
  border-radius:14px;
  padding:6px 10px;
  gap:8px;
}

.pass-wrap input{
  flex:1;
  border:none;
  background:transparent;
  font-size:16px;
  outline:none;
  padding:10px;
}

.toggle-btn{
  border:none;
  background:#d9f5e6;
  color:#145a3a;
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
}

.toggle-btn:hover{
  background:#c8eedb;
}

.btn{
  width:100%;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  border:none;
  padding:14px;
  border-radius:16px;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  font-weight:600;
}

.btn:hover{
  opacity:.95;
}

.note{
  margin-top:16px;
  font-size:13px;
  color:#c9f3df;
  text-align:center;
}

.message{
  margin-top:14px;
  padding:10px;
  border-radius:12px;
  font-size:14px;
  display:none;
  text-align:center;
}

.error{
  background:#b93a3a;
}

.success{
  background:#1abc9c;
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <button class="lang-btn">AR / EN</button>
  </div>

  <h1>لوحة عضو هيئة التدريس</h1>
  <div class="subtitle">يرجى إدخال كلمة المرور للمتابعة</div>

  <div class="field">
    <label class="label">كلمة المرور</label>
    <div class="pass-wrap">
      <input
        id="doctorKeyLock"
        type="password"
        placeholder="••••"
        inputmode="numeric"
        maxlength="6"
      >
      <button
        class="toggle-btn"
        type="button"
        onclick="togglePassword()"
        id="toggleText">
        إظهار
      </button>
    </div>
  </div>

  <button class="btn" onclick="loginDoctor()">دخول</button>

  <div id="msg" class="message"></div>

  <div class="note">
    هذه الصفحة مخصصة لأعضاء هيئة التدريس فقط
  </div>

</div>

<script>
const DOCTOR_PASSWORD = "1111";
let shown = false;

function togglePassword(){
  const input = document.getElementById("doctorKeyLock");
  const btn = document.getElementById("toggleText");

  shown = !shown;
  input.type = shown ? "text" : "password";
  btn.textContent = shown ? "إخفاء" : "إظهار";
}

function loginDoctor(){
  const val = document.getElementById("doctorKeyLock").value.trim();
  const msg = document.getElementById("msg");

  if(val === DOCTOR_PASSWORD){
    msg.className = "message success";
    msg.textContent = "تم التحقق بنجاح، يتم التحويل...";
    msg.style.display = "block";

    setTimeout(()=>{
      window.location.href = "dashboard.html";
    },800);
  }else{
    msg.className = "message error";
    msg.textContent = "كلمة المرور غير صحيحة";
    msg.style.display = "block";
  }
}
</script>

</body>
</html>
