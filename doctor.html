<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لوحة عضو هيئة التدريس</title>

<style>
/* ================== ROOT ================== */
:root{
  --g1:#0f5132;
  --g2:#198754;
  --g3:#2fbf71;
  --card:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.15);
  --txt:rgba(255,255,255,.96);
  --muted:rgba(255,255,255,.7);
}

/* ================== BASE ================== */
*{box-sizing:border-box;font-family:"Segoe UI",Tahoma,sans-serif}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));
  color:var(--txt);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================== CARD ================== */
.card{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid var(--stroke);
  border-radius:22px;
  padding:28px;
  backdrop-filter: blur(16px);
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

/* ================== HEAD ================== */
.h-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:6px;
}
.h-sub{
  font-size:14px;
  color:var(--muted);
  margin-bottom:22px;
}

/* ================== INPUT ================== */
.input{
  width:100%;
  height:54px;
  border-radius:16px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:16px;
  padding:0 16px;
  outline:none;
}
.input::placeholder{color:rgba(255,255,255,.6)}

/* ================== PASSWORD ================== */
.pass-wrap{position:relative}
.pass-wrap .input{padding-left:52px}
.eye-btn{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border-radius:12px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.18);
  color:#fff;
  cursor:pointer;
}

/* ================== BUTTON ================== */
.btn{
  width:100%;
  height:54px;
  border-radius:18px;
  border:none;
  margin-top:18px;
  font-size:16px;
  font-weight:600;
  color:#0a3d2a;
  background:linear-gradient(135deg,#9be7c4,#d7fff0);
  cursor:pointer;
}
.btn:hover{opacity:.95}

/* ================== FOOT ================== */
.note{
  margin-top:16px;
  font-size:13px;
  text-align:center;
  color:rgba(255,255,255,.75)
}

/* ================== LANG ================== */
.lang{
  position:absolute;
  top:16px;
  left:16px;
}
.lang button{
  border-radius:12px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.12);
  color:#fff;
  padding:8px 12px;
  cursor:pointer;
}

/* ================== HIDE ================== */
.hidden{display:none}
.error{
  margin-top:12px;
  color:#ffb3b3;
  font-size:14px;
  text-align:center;
}
</style>
</head>

<body>

<div class="lang">
  <button onclick="toggleLang()">AR / EN</button>
</div>

<!-- ================== LOCK SCREEN ================== -->
<div id="lockScreen" class="card">
  <div class="h-title">لوحة عضو هيئة التدريس</div>
  <div class="h-sub">يرجى إدخال كلمة المرور للمتابعة</div>

  <div class="pass-wrap">
    <input id="doctorKeyLock" class="input" type="password"
           placeholder="كلمة المرور"
           inputmode="numeric"
           maxlength="10" />
    <button class="eye-btn" onclick="togglePassword()">👁️</button>
  </div>

  <button class="btn" onclick="checkKey()">دخول</button>
  <div id="err" class="error hidden">كلمة المرور غير صحيحة</div>

  <div class="note">هذه الصفحة مخصصة للدكتور فقط</div>
</div>

<!-- ================== DASHBOARD ================== -->
<div id="dashboard" class="card hidden">
  <div class="h-title">إدارة المحاضرات</div>
  <div class="h-sub">إنشاء ومتابعة الحضور</div>

  <div style="margin-top:18px;color:var(--muted);font-size:14px">
    ✅ تم فتح لوحة التحكم بنجاح
  </div>

  <!-- هنا يكمل شغلك الحالي بدون تغيير -->
</div>

<script>
/* ================== PASSWORD ================== */
const CORRECT_KEY = "1111";

function checkKey(){
  const v = document.getElementById("doctorKeyLock").value;
  if(v === CORRECT_KEY){
    document.getElementById("lockScreen").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
  }else{
    document.getElementById("err").classList.remove("hidden");
  }
}

function togglePassword(){
  const i = document.getElementById("doctorKeyLock");
  i.type = i.type === "password" ? "text" : "password";
}

/* ================== LANG (placeholder) ================== */
let lang="ar";
function toggleLang(){
  lang = lang==="ar" ? "en" : "ar";
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
}
</script>

</body>
</html>
