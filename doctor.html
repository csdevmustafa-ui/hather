<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لوحة عضو هيئة التدريس</title>

<style>
:root{
  --g1:#0f3d2e;
  --g2:#145a3a;
  --g3:#1f8a5b;
  --card:#1a6f4a;
  --soft:#e9fff5;
  --white:#ffffff;
}

*{box-sizing:border-box;font-family:"Segoe UI",Tahoma}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.card{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#1d7a52,#155a3c);
  border-radius:22px;
  padding:28px;
  box-shadow:0 30px 60px rgba(0,0,0,.35);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.lang-btn{
  background:rgba(255,255,255,.15);
  border:none;
  color:#fff;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
}

h1{
  font-size:22px;
  margin:0;
  font-weight:700;
}

.subtitle{
  font-size:14px;
  color:#dff7ec;
  margin-bottom:20px;
}

.field{
  margin-bottom:18px;
}

.label{
  font-size:14px;
  margin-bottom:6px;
  display:block;
}

.pass-wrap{
  display:flex;
  align-items:center;
  background:var(--soft);
  border-radius:14px;
  padding:8px 12px;
}

.pass-wrap input{
  flex:1;
  border:none;
  background:transparent;
  font-size:16px;
  outline:none;
}

.eye-btn{
  background:none;
  border:none;
  cursor:pointer;
  font-size:18px;
}

.btn{
  width:100%;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  border:none;
  padding:14px;
  border-radius:16px;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  font-weight:600;
}

.btn:hover{opacity:.95}

.note{
  margin-top:14px;
  font-size:13px;
  color:#c9f3df;
  text-align:center;
}

.error{
  margin-top:12px;
  background:#b93a3a;
  padding:10px;
  border-radius:12px;
  font-size:14px;
  display:none;
}

.success{
  background:#1abc9c;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <button class="lang-btn">AR / EN</button>
  </div>

  <h1>لوحة عضو هيئة التدريس</h1>
  <div class="subtitle">يرجى إدخال كلمة المرور للمتابعة</div>

  <div class="field">
    <label class="label">كلمة المرور</label>
    <div class="pass-wrap">
      <input
        id="doctorKeyLock"
        type="password"
        placeholder="••••"
        inputmode="numeric"
        maxlength="6"
      />
      <button class="eye-btn" type="button"
        onclick="togglePassword(this)"
        aria-label="إظهار/إخفاء كلمة المرور">👁️</button>
    </div>
  </div>

  <button class="btn" onclick="loginDoctor()">دخول</button>

  <div id="msg" class="error"></div>

  <div class="note">
    هذه الصفحة مخصصة لأعضاء هيئة التدريس فقط
  </div>

</div>

<script>
const DOCTOR_PASSWORD = "1111";

function togglePassword(btn){
  const input = document.getElementById("doctorKeyLock");
  const hidden = input.type === "password";

  input.type = hidden ? "text" : "password";
  btn.textContent = hidden ? "🙈" : "👁️";
}

function loginDoctor(){
  const val = document.getElementById("doctorKeyLock").value.trim();
  const msg = document.getElementById("msg");

  if(val === DOCTOR_PASSWORD){
    msg.className = "error success";
    msg.textContent = "تم التحقق بنجاح، يتم تحويلك...";
    msg.style.display = "block";

    setTimeout(()=>{
      // غير الرابط لو تحب
      window.location.href = "dashboard.html";
    },900);

  }else{
    msg.className = "error";
    msg.textContent = "كلمة المرور غير صحيحة";
    msg.style.display = "block";
  }
}
</script>

</body>
</html>
