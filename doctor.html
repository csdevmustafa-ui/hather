<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة عضو هيئة التدريس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(135deg,#083d25,#0f6b42);
  color:#fff;
}

/* ===== Lock Screen ===== */
.lock-screen{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#083d25,#0f6b42);
  z-index:9999;
}
.lock-card{
  width:440px; max-width:95%;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border-radius:26px;
  padding:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.lock-card h1{margin:0;font-size:22px}
.lock-card p{
  margin:6px 0 18px;
  color:rgba(255,255,255,.9);
}

/* ===== PIN ===== */
.pin-wrap{position:relative}
.pin-input{
  width:100%;
  padding:14px 52px 14px 14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:16px;
}
.pin-input::placeholder{
  color:rgba(255,255,255,.8);
}
.toggle-pin{
  position:absolute;
  top:50%; left:14px;
  transform:translateY(-50%);
  background:none;border:none;
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

/* ===== Buttons ===== */
.btn{
  display:flex; align-items:center; justify-content:center;
  gap:8px;
  padding:14px;
  border-radius:16px;
  border:none;
  cursor:pointer;
  font-weight:700;
}
.btn.primary{
  background:linear-gradient(135deg,#19c37d,#0f9d62);
  color:#fff;
}
.btn.secondary{
  background:rgba(255,255,255,.14);
  color:#fff;
}

/* ===== Layout ===== */
.container{max-width:1200px;margin:auto;padding:24px}
.hidden{display:none}

/* ===== Cards ===== */
.card{
  background:rgba(255,255,255,.08);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
}

/* ===== Inputs ===== */
.input{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);
  color:#fff;
}
label,.small,.status,.qr-hint{color:rgba(255,255,255,.95)}
::placeholder{color:rgba(255,255,255,.8)}

/* ===== Table ===== */
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:center}
th{background:rgba(0,0,0,.25)}
tr{cursor:pointer}
tr:hover{background:rgba(255,255,255,.08)}
</style>
</head>

<body>

<!-- ================= LOCK ================= -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <h1>لوحة عضو هيئة التدريس</h1>
    <p>يرجى إدخال كلمة المرور للمتابعة</p>

    <div class="pin-wrap">
      <input id="doctorPin" class="pin-input" type="password" placeholder="كلمة المرور" maxlength="10">
      <button class="toggle-pin" onclick="togglePin()">👁</button>
    </div>

    <button class="btn primary" style="margin-top:18px" onclick="unlock()">دخول</button>
    <div id="lockStatus" class="small"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="doctorApp" class="hidden">
  <div class="container">

    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>لوحة التحكم</h2>
      <button class="btn secondary" onclick="lock()">تسجيل الخروج</button>
    </div>

    <!-- Create Lecture -->
    <div class="card">
      <h3>إنشاء محاضرة</h3>
      <label>المقرر</label>
      <input id="course" class="input" placeholder="CS111">

      <label>الشعبة</label>
      <input id="section" class="input" placeholder="1">

      <label>وقت البداية</label>
      <input id="start" class="input" type="datetime-local">

      <label>وقت النهاية</label>
      <input id="end" class="input" type="datetime-local">

      <button class="btn primary" style="margin-top:14px" onclick="createLecture()">إنشاء</button>
      <div id="createStatus" class="small"></div>
    </div>

    <!-- Lectures -->
    <div class="card">
      <h3>المحاضرات</h3>
      <table>
        <thead>
          <tr>
            <th>LectureID</th>
            <th>المقرر</th>
            <th>الشعبة</th>
          </tr>
        </thead>
        <tbody id="lectureRows">
          <tr><td colspan="3">لا توجد محاضرات</td></tr>
        </tbody>
      </table>
    </div>

    <!-- QR -->
    <div class="card">
      <h3>الكود و QR للمحاضرة</h3>
      <label>LectureID المحدد</label>
      <input id="selectedLectureId" class="input" placeholder="اختر من الجدول أو الصقه هنا">

      <div style="display:flex;gap:12px;margin-top:12px">
        <button class="btn primary" onclick="generateCode()">توليد رمز حضور</button>
        <button class="btn secondary" onclick="showStudents()">عرض الطلاب</button>
      </div>

      <div id="codeStatus" class="small"></div>
    </div>

  </div>
</div>

<script src="assets/app.js"></script>

<script>
const DOCTOR_PIN="1111";

function togglePin(){
  const i=doctorPin;
  i.type=i.type==="password"?"text":"password";
}

function unlock(){
  if(doctorPin.value!==DOCTOR_PIN){
    lockStatus.innerText="❌ كلمة المرور غير صحيحة";
    return;
  }
  lockScreen.style.display="none";
  doctorApp.classList.remove("hidden");
  loadLectures();
}

function lock(){
  doctorPin.value="";
  doctorApp.classList.add("hidden");
  lockScreen.style.display="flex";
}

async function createLecture(){
  const res=await apiCall({
    action:"createLecture",
    doctorKey:DOCTOR_PIN,
    course:course.value,
    section:section.value,
    start:start.value,
    end:end.value
  });
  createStatus.innerText=res?.ok?"تم إنشاء المحاضرة":"فشل";
  loadLectures();
}

async function loadLectures(){
  const res=await apiCall({action:"listLectures",doctorKey:DOCTOR_PIN});
  lectureRows.innerHTML=res?.rows?.map(r=>`
    <tr onclick="selectedLectureId.value='${r.lectureId}'">
      <td>${r.lectureId}</td>
      <td>${r.course}</td>
      <td>${r.section}</td>
    </tr>`).join("") || "<tr><td colspan='3'>لا توجد محاضرات</td></tr>";
}

async function generateCode(){
  const res=await apiCall({
    action:"generateCode",
    doctorKey:DOCTOR_PIN,
    lectureId:selectedLectureId.value
  });
  codeStatus.innerText=res?.ok?"تم توليد الرمز":"فشل";
}

function showStudents(){
  alert("عرض الطلاب (مربوط بالشيت)");
}
</script>

</body>
</html>
