<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hather - Doctor</title>

<!-- QR Generator -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{
    min-height:100vh;
    background: linear-gradient(135deg,#0d2c1a 0%, #1a472a 45%, #2d7d46 100%);
    display:flex;align-items:center;justify-content:center;
    padding:20px;color:#fff;
  }
  .wrap{
    width:100%;max-width:1100px;border-radius:18px;padding:22px;
    background: rgba(13, 44, 26, 0.78);
    box-shadow: 0 18px 45px rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .icon-btn{
    width:42px;height:42px;border-radius:12px;border:none;cursor:pointer;
    background: rgba(255,255,255,.12);color:#fff;font-size:18px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
  }
  .back{color:#d6ffe9;text-decoration:none;font-weight:900;opacity:.9}
  .header{text-align:center;padding-bottom:14px;margin-bottom:16px;position:relative}
  .header::after{
    content:'';position:absolute;bottom:0;left:15%;right:15%;height:2px;
    background: linear-gradient(to right, transparent, rgba(76,201,135,.95), transparent);
  }
  .title{
    font-size:42px;font-weight:900;
    background: linear-gradient(135deg, #b9ffd9, #4cc987);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{margin-top:6px;font-size:16px;font-weight:900;color:#d6ffe9;opacity:.95}
  .card{
    background: rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.10);
    border-radius:16px;padding:14px;margin-top:12px
  }
  .row{display:flex;gap:12px;flex-wrap:wrap}
  label{display:block;margin:10px 0 6px;font-weight:900;color: rgba(255,255,255,.92)}
  input{
    width:100%;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.92);font-size:15px;color:#0d2c1a;direction:ltr;
  }
  button.primary{
    padding:12px 14px;border:none;border-radius:12px;cursor:pointer;
    color:#fff;font-weight:900;background: linear-gradient(135deg,#1a472a,#2d7d46,#4cc987);
  }
  button.dark{
    padding:12px 14px;border:none;border-radius:12px;cursor:pointer;
    color:#fff;font-weight:900;background: linear-gradient(135deg,#244b3a,#0d2c1a);
  }
  .msg{min-height:22px;margin-top:10px;text-align:center;font-weight:900}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.10);text-align:right}
  th{color:#eafff3;background: rgba(255,255,255,.06)}
  .date{direction:ltr;unicode-bidi:isolate;text-align:left;font-family:monospace}
  select.statusSel{
    width:100%;padding:10px;border-radius:12px;border:2px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.92);color:#0d2c1a
  }
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:900;font-size:12px}
  .pA{background:rgba(76,201,135,.18);color:#7CFFB2}
  .pU{background:rgba(244,180,0,.16);color:#ffd27a}
  .pE{background:rgba(255,120,120,.16);color:#ffb2b2}

  /* code card */
  .code-num{font-size:48px;font-weight:1000;letter-spacing:2px;color:#d6ffe9;margin-top:6px}
  .qrWhite{background:#fff;padding:12px;border-radius:14px}
</style>
</head>

<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html" id="backHome">↩ الرئيسية</a>
    <button class="icon-btn" id="langBtn" title="Language">🌐</button>
  </div>

  <div class="header">
    <div class="title">Hather</div>
    <div class="subtitle" id="subTitle">قسم الدكتور</div>
  </div>

  <div class="card">
    <div class="row">
      <div style="flex:1;min-width:220px">
        <label id="lblKey">رمز الدكتور</label>
        <input id="doctorKey" value="1111" placeholder="اكتب الرمز هنا">
      </div>
      <div style="display:flex;align-items:end;gap:10px">
        <button class="dark" id="btnRefresh">تحديث القائمة</button>
      </div>
    </div>
    <div class="msg" id="topMsg"></div>
  </div>

  <!-- Code + QR card -->
  <div class="card" id="codeCard" style="display:none">
    <h3 style="margin-bottom:10px" id="codeTitle">كود المحاضرة</h3>

    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div style="flex:1;min-width:240px">
        <div style="font-weight:900;opacity:.9" id="codeLabel">الكود الحالي</div>
        <div id="codeText" class="code-num"></div>
        <div style="opacity:.8;margin-top:6px" id="codeHint">امسح الـ QR أو اكتب الكود يدويًا</div>
      </div>

      <div class="qrWhite">
        <div id="qrBox"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 id="createTitle" style="margin-bottom:10px">إنشاء محاضرة</h3>
    <div class="row">
      <div style="flex:1;min-width:160px">
        <label id="lblCourse">المقرر</label>
        <input id="course" placeholder="CS101">
      </div>
      <div style="flex:1;min-width:120px">
        <label id="lblSection">الشعبة</label>
        <input id="section" placeholder="1">
      </div>
      <div style="flex:1;min-width:220px">
        <label id="lblStart">البداية</label>
        <input id="start" type="datetime-local">
      </div>
      <div style="flex:1;min-width:220px">
        <label id="lblEnd">النهاية</label>
        <input id="end" type="datetime-local">
      </div>
      <div style="display:flex;align-items:end">
        <button class="primary" id="btnCreate">حفظ</button>
      </div>
    </div>
    <div class="msg" id="createMsg"></div>
  </div>

  <div class="card">
    <h3 id="listTitle" style="margin-bottom:10px">المحاضرات</h3>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>LectureID</th>
            <th id="thCourse">المقرر</th>
            <th id="thSection">الشعبة</th>
            <th id="thStart">البداية</th>
            <th id="thEnd">النهاية</th>
            <th id="thStatus">الحالة</th>
            <th id="thActions">إجراءات</th>
          </tr>
        </thead>
        <tbody id="lecturesBody"></tbody>
      </table>
    </div>
    <div class="msg" id="listMsg"></div>
  </div>

  <div class="card">
    <h3 id="studentsTitle" style="margin-bottom:10px">طلاب المحاضرة</h3>
    <div class="row">
      <div style="flex:1;min-width:240px">
        <label id="lblStudentsLecture">LectureID</label>
        <input id="studentsLectureId" placeholder="الصق LectureID هنا">
      </div>
      <div style="display:flex;align-items:end;gap:10px">
        <button class="primary" id="btnLoadStudents">عرض الطلاب</button>
      </div>
    </div>

    <div class="msg" id="studentsMsg"></div>

    <div style="overflow:auto;margin-top:10px">
      <table>
        <thead>
          <tr>
            <th id="thSid">StudentID</th>
            <th id="thName">الاسم</th>
            <th id="thCur">الحالة الحالية</th>
            <th id="thSet">تغيير الحالة</th>
            <th id="thSave">حفظ</th>
          </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyojswsuqQi3sHXxNuqmED2pXMm0wRHkWEg6s8dx3tlpKvrl3hs5RDbPonj8EjdYX0/exec";

  const STR={
    ar:{dir:"rtl",lang:"ar",back:"↩ الرئيسية",sub:"قسم الدكتور",
        key:"رمز الدكتور",refresh:"تحديث القائمة",
        create:"إنشاء محاضرة",course:"المقرر",section:"الشعبة",start:"البداية",end:"النهاية",save:"حفظ",
        lectures:"المحاضرات",c:"المقرر",s:"الشعبة",st:"البداية",en:"النهاية",status:"الحالة",actions:"إجراءات",
        students:"طلاب المحاضرة",loadStudents:"عرض الطلاب",name:"الاسم",cur:"الحالة الحالية",set:"تغيير الحالة",saveOne:"حفظ",
        needKey:"❌ اكتب رمز الدكتور أولًا",loading:"⏳ جاري التحميل...",done:"✅ تم",fail:"❌ فشل",
        active:"نشطة",up:"قادمة",ended:"منتهية",
        gen:"كود",del:"حذف",
        codeTitle:"كود المحاضرة", codeLabel:"الكود الحالي", codeHint:"امسح الـ QR أو اكتب الكود يدويًا"
    },
    en:{dir:"ltr",lang:"en",back:"↩ Home",sub:"Doctor",
        key:"Doctor key",refresh:"Refresh",
        create:"Create lecture",course:"Course",section:"Section",start:"Start",end:"End",save:"Save",
        lectures:"Lectures",c:"Course",s:"Section",st:"Start",en:"End",status:"Status",actions:"Actions",
        students:"Lecture students",loadStudents:"Load students",name:"Name",cur:"Current status",set:"Set status",saveOne:"Save",
        needKey:"❌ Enter doctor key first",loading:"⏳ Loading...",done:"✅ Done",fail:"❌ Failed",
        active:"Active",up:"Upcoming",ended:"Ended",
        gen:"Code",del:"Delete",
        codeTitle:"Lecture Code", codeLabel:"Current code", codeHint:"Scan the QR or type the code"
    }
  };

  function getLang(){return localStorage.getItem("hather_lang")||"ar";}
  function setLang(l){localStorage.setItem("hather_lang",l);}
  function applyLang(){
    const t=STR[getLang()];
    document.documentElement.lang=t.lang; document.documentElement.dir=t.dir;
    backHome.textContent=t.back; subTitle.textContent=t.sub;
    lblKey.textContent=t.key; btnRefresh.textContent=t.refresh;
    createTitle.textContent=t.create; lblCourse.textContent=t.course; lblSection.textContent=t.section;
    lblStart.textContent=t.start; lblEnd.textContent=t.end; btnCreate.textContent=t.save;
    listTitle.textContent=t.lectures; thCourse.textContent=t.c; thSection.textContent=t.s; thStart.textContent=t.st; thEnd.textContent=t.en;
    thStatus.textContent=t.status; thActions.textContent=t.actions;
    studentsTitle.textContent=t.students; btnLoadStudents.textContent=t.loadStudents;
    thName.textContent=t.name; thCur.textContent=t.cur; thSet.textContent=t.set; thSave.textContent=t.saveOne;

    codeTitle.textContent=t.codeTitle;
    codeLabel.textContent=t.codeLabel;
    codeHint.textContent=t.codeHint;
  }
  langBtn.onclick=()=>{setLang(getLang()==="ar"?"en":"ar");applyLang();};
  applyLang();

  function msg(el, text, ok=true){
    el.style.color = ok ? "#7CFFB2" : "salmon";
    el.textContent = text;
  }
  function doctorKeyVal(){ return doctorKey.value.trim(); }
  function requireKey(){
    if(!doctorKeyVal()){ msg(topMsg, STR[getLang()].needKey, false); return false; }
    return true;
  }
  function pill(status){
    const t=STR[getLang()];
    if(status==="Active") return `<span class="pill pA">${t.active}</span>`;
    if(status==="Upcoming") return `<span class="pill pU">${t.up}</span>`;
    return `<span class="pill pE">${t.ended}</span>`;
  }
  async function post(payload){
    const res = await fetch(SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  btnRefresh.onclick = refreshLectures;

  async function refreshLectures(){
    if(!requireKey()) return;
    msg(listMsg, STR[getLang()].loading, true);
    lecturesBody.innerHTML="";
    try{
      const data = await post({action:"listLectures", doctorKey: doctorKeyVal()});
      if(!data.ok) throw new Error();
      data.lectures.forEach(l=>{
        const t=STR[getLang()];
        lecturesBody.innerHTML += `
          <tr>
            <td class="date">${l.lectureId}</td>
            <td>${l.course}</td>
            <td>${l.section}</td>
            <td class="date">${l.start}</td>
            <td class="date">${l.end}</td>
            <td>${pill(l.status)}</td>
            <td>
              <button class="primary" onclick="rotateCode('${l.lectureId}')">${t.gen}</button>
              <button class="dark" onclick="fillStudents('${l.lectureId}')">${t.students}</button>
              <button class="dark" onclick="deleteLecture('${l.lectureId}')">${t.del}</button>
            </td>
          </tr>
        `;
      });
      msg(listMsg, STR[getLang()].done, true);
    }catch(e){
      msg(listMsg, STR[getLang()].fail, false);
    }
  }

  btnCreate.onclick = createLecture;

  async function createLecture(){
    if(!requireKey()) return;
    const courseV = course.value.trim();
    const sectionV = section.value.trim();
    const startTime = start.value;
    const endTime = end.value;

    if(!courseV || !sectionV || !startTime || !endTime){
      msg(createMsg, getLang()==="ar" ? "❌ أدخل كل البيانات" : "❌ Fill all fields", false);
      return;
    }

    msg(createMsg, STR[getLang()].loading, true);
    try{
      const data = await post({action:"createLecture", doctorKey: doctorKeyVal(), course:courseV, section:sectionV, startTime, endTime});
      if(!data.ok) throw new Error();
      msg(createMsg, `✅ LectureID: ${data.lectureId}`, true);
      refreshLectures();
    }catch(e){
      msg(createMsg, STR[getLang()].fail, false);
    }
  }

  async function deleteLecture(lectureId){
    if(!requireKey()) return;
    if(!confirm(getLang()==="ar" ? "حذف المحاضرة؟" : "Delete lecture?")) return;
    msg(listMsg, STR[getLang()].loading, true);
    try{
      const data = await post({action:"deleteLecture", doctorKey: doctorKeyVal(), lectureId});
      if(!data.ok) throw new Error();
      msg(listMsg, STR[getLang()].done, true);
      refreshLectures();
    }catch(e){
      msg(listMsg, STR[getLang()].fail, false);
    }
  }

  // Generate code + show QR
  async function rotateCode(lectureId){
    if(!requireKey()) return;

    try{
      const data = await post({action:"rotateCode", doctorKey: doctorKeyVal(), lectureId});
      if(!data.ok) throw new Error();

      codeCard.style.display = "block";
      codeText.textContent = data.code;

      qrBox.innerHTML = "";
      new QRCode(qrBox, { text: data.code, width: 170, height: 170 });

      alert(`Lecture Code: ${data.code}\nValid for 2 minutes`);
    }catch(e){
      alert(getLang()==="ar" ? "فشل توليد الكود" : "Failed to generate code");
    }
  }

  function fillStudents(lectureId){
    studentsLectureId.value = lectureId;
    loadLectureStudents();
  }

  btnLoadStudents.onclick = loadLectureStudents;

  async function loadLectureStudents(){
    if(!requireKey()) return;
    const lectureId = studentsLectureId.value.trim();
    if(!lectureId){ msg(studentsMsg, "❌ أدخل LectureID", false); return; }

    msg(studentsMsg, STR[getLang()].loading, true);
    studentsBody.innerHTML = "";
    try{
      const data = await post({action:"getLectureStudents", doctorKey: doctorKeyVal(), lectureId});
      if(!data.ok) throw new Error();

      msg(studentsMsg, `✅ ${data.students.length} طالب (شعبة ${data.section})`, true);

      data.students.forEach(st=>{
        const current = st.status || "—";
        const safeName = st.name || "—";
        studentsBody.innerHTML += `
          <tr>
            <td class="date">${st.studentId}</td>
            <td>${safeName}</td>
            <td id="cur-${st.studentId}">${current}</td>
            <td>
              <select class="statusSel" id="sel-${st.studentId}">
                <option value="حضور">حضور</option>
                <option value="تأخير">تأخير</option>
                <option value="غياب">غياب</option>
                <option value="معذور">معذور</option>
              </select>
            </td>
            <td><button class="dark" onclick="saveOne('${lectureId}','${st.studentId}')">${STR[getLang()].saveOne}</button></td>
          </tr>
        `;
        const sel = document.getElementById(`sel-${st.studentId}`);
        if(["حضور","تأخير","غياب","معذور"].includes(current)) sel.value = current;
      });

    }catch(e){
      msg(studentsMsg, STR[getLang()].fail, false);
    }
  }

  async function saveOne(lectureId, studentId){
    if(!requireKey()) return;
    const status = document.getElementById(`sel-${studentId}`).value;
    msg(studentsMsg, STR[getLang()].loading, true);
    try{
      const data = await post({action:"setStudentStatus", doctorKey: doctorKeyVal(), lectureId, studentId, status});
      if(!data.ok) throw new Error();
      document.getElementById(`cur-${studentId}`).textContent = status;
      msg(studentsMsg, `✅ تم تحديث ${studentId} إلى (${status})`, true);
    }catch(e){
      msg(studentsMsg, STR[getLang()].fail, false);
    }
  }

  // auto-load lectures
  window.addEventListener("load", ()=>{ refreshLectures(); });
</script>
</body>
</html>
