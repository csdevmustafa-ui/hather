<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor - Hather</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="brand-left">
      <div class="logo" onclick="location.href='index.html'" style="cursor:pointer">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="rgba(255,255,255,.9)" stroke-width="1.8"/>
        </svg>
      </div>
      <div class="brand-titles">
        <h1 data-i18n="doctorTitle">لوحة عضو هيئة التدريس</h1>
        <p data-i18n="doctorSub">إدارة المحاضرات والرموز</p>
      </div>
    </div>

    <div class="top-actions">
      <div class="lang-chip" onclick="toggleLang()"><span>AR/EN</span></div>
    </div>
  </div>

  <div class="grid-center">
    <div class="card wide">

      <!-- Doctor Password -->
      <div class="row">
        <div>
          <label>كلمة مرور الدكتور</label>
          <input id="doctorKey" class="input" type="password" value="111" />
          <div class="small">مطلوبة للوصول للوحة الدكتور</div>
        </div>
        <div style="display:flex; align-items:end;">
          <button class="btn primary" onclick="checkDoctorKey()">
            <div class="left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 15v2" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
                <path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
                <path d="M6 22h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2Z" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
              </svg>
            </div>
            <div class="text" style="text-align:right">
              <span>تسجيل الدخول</span>
              <span class="sub">Password: 111</span>
            </div>
          </button>
        </div>
      </div>

      <div class="status" id="pinStatus"></div>

      <div class="hr"></div>

      <!-- Create Lecture -->
      <h3 style="margin:0 0 10px">إنشاء محاضرة</h3>
      <div class="row">
        <div>
          <label>المقرر</label>
          <input id="course" class="input" placeholder="مثال: CS111" />
        </div>
        <div>
          <label>الشعبة</label>
          <input id="section" class="input" placeholder="مثال: 1" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>وقت البداية</label>
          <input id="start" class="input" type="datetime-local" />
        </div>
        <div>
          <label>وقت النهاية</label>
          <input id="end" class="input" type="datetime-local" />
        </div>
      </div>

      <div class="actions">
        <button id="btnCreate" class="btn primary" onclick="createLecture()">
          <div class="left"><div class="spinner" id="spCreate"></div></div>
          <div class="text"><span>إنشاء</span><span class="sub">محاضرة واحدة</span></div>
        </button>
        <button class="btn" onclick="loadLectures()">
          <div class="left"><span style="font-weight:900">↻</span></div>
          <div class="text"><span>تحديث</span><span class="sub">قائمة المحاضرات</span></div>
        </button>
      </div>

      <div class="status" id="createStatus"></div>

      <div class="hr"></div>

      <!-- Weekly Schedule -->
      <h3 style="margin:0 0 10px">إنشاء جدول أسبوعي</h3>
      <div class="row">
        <div>
          <label>المقرر</label>
          <input id="wCourse" class="input" placeholder="مثال: CS111" />
        </div>
        <div>
          <label>الشعبة</label>
          <input id="wSection" class="input" placeholder="مثال: 1" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>من تاريخ</label>
          <input id="fromDate" class="input" type="date" />
        </div>
        <div>
          <label>إلى تاريخ</label>
          <input id="toDate" class="input" type="date" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>وقت البداية</label>
          <input id="wStartTime" class="input" type="time" />
        </div>
        <div>
          <label>وقت النهاية</label>
          <input id="wEndTime" class="input" type="time" />
        </div>
      </div>

      <div style="margin-top:8px" class="small">الأيام:</div>
      <div class="row" style="grid-template-columns: repeat(5, 1fr); margin-top:8px">
        <label><input type="checkbox" class="day" value="0"> أحد</label>
        <label><input type="checkbox" class="day" value="1"> اثنين</label>
        <label><input type="checkbox" class="day" value="2"> ثلاثاء</label>
        <label><input type="checkbox" class="day" value="3"> أربعاء</label>
        <label><input type="checkbox" class="day" value="4"> خميس</label>
      </div>

      <div class="actions" style="margin-top:10px">
        <button id="btnSchedule" class="btn primary" onclick="createSchedule()">
          <div class="left"><div class="spinner" id="spSchedule"></div></div>
          <div class="text"><span>إنشاء الجدول</span><span class="sub">يولّد محاضرات تلقائيًا</span></div>
        </button>
      </div>

      <div class="status" id="scheduleStatus"></div>

      <div class="hr"></div>

      <!-- Lectures -->
      <h3 style="margin:0 0 10px">المحاضرات</h3>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>LectureID</th>
              <th>المقرر</th>
              <th>الشعبة</th>
              <th>البداية</th>
              <th>النهاية</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="lectureRows"></tbody>
        </table>
      </div>

      <div class="hr"></div>

      <!-- QR + Code -->
      <h3 style="margin:0 0 10px">الكود و QR للمحاضرة</h3>

      <div class="qr-wrap">
        <div class="card" style="margin:0">
          <label>LectureID المحدد</label>
          <input id="selectedLectureId" class="input" placeholder="اختر من الجدول أو الصقه هنا" />

          <div style="height:10px"></div>
          <div class="actions">
            <button id="btnCode" class="btn primary" onclick="generateNewCode()">
              <div class="left"><div class="spinner" id="spCode"></div></div>
              <div class="text"><span>توليد رمز حضور جديد</span><span class="sub">Code + QR</span></div>
            </button>
            <button class="btn" onclick="showStudents()">
              <div class="left"><span style="font-weight:900">👥</span></div>
              <div class="text"><span>عرض الطلاب</span><span class="sub">لهذه المحاضرة</span></div>
            </button>
          </div>

          <div class="status" id="codeStatus"></div>
        </div>

        <div class="qr-box">
          <img id="qrImg" alt="QR">
          <div class="qr-code-text" id="codeText">Code: —</div>
          <div class="qr-hint">صلاحية قصيرة لتقليل المشاركة</div>
          <div class="qr-actions">
            <button class="btn" onclick="zoomQR()">
              <div class="left"><span style="font-weight:900">⤢</span></div>
              <div class="text"><span>تكبير QR</span><span class="sub">للعرض على الطلاب</span></div>
            </button>
          </div>
        </div>
      </div>

      <div class="hr"></div>

      <h3 style="margin:0 0 10px">طلاب المحاضرة</h3>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>StudentID</th>
              <th>الاسم</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="studentRows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- QR Modal -->
<div class="modal" id="qrModal" onclick="closeQrModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <img id="qrBig" alt="QR Big">
    <div class="modal-actions">
      <button class="btn primary" onclick="closeQrModal()">
        <div class="left"><span style="font-weight:900">✕</span></div>
        <div class="text"><span>إغلاق</span><span class="sub">—</span></div>
      </button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
applyLang();

function getDoctorKey(){
  return (document.getElementById("doctorKey").value||"").trim();
}

function checkDoctorKey(){
  const k = getDoctorKey();
  const st = document.getElementById("pinStatus");
  if(k !== "111"){
    showStatus(st,"danger","كلمة المرور غير صحيحة");
  }else{
    showStatus(st,"success","تم الدخول بنجاح ✅");
    loadLectures();
  }
}

async function createLecture(){
  const doctorKey = getDoctorKey();
  const st = document.getElementById("createStatus");
  if(doctorKey!=="111"){ showStatus(st,"danger","كلمة المرور غير صحيحة"); return; }

  const course = (document.getElementById("course").value||"").trim();
  const section= (document.getElementById("section").value||"").trim();
  const start  = (document.getElementById("start").value||"").trim();
  const end    = (document.getElementById("end").value||"").trim();

  const btn = document.getElementById("btnCreate");
  const sp  = document.getElementById("spCreate");
  setLoading(btn, sp, true);
  showStatus(st,"warn",t("loading"));

  const res = await apiCall({action:"createLecture", doctorKey, course, section, start, end});
  setLoading(btn, sp, false);

  if(res && res.ok){
    showStatus(st,"success","تم إنشاء المحاضرة");
    loadLectures();
  }else{
    showStatus(st,"danger",(res&&res.error)?res.error:t("failed"));
  }
}

async function createSchedule(){
  const doctorKey = getDoctorKey();
  const st = document.getElementById("scheduleStatus");
  if(doctorKey!=="111"){ showStatus(st,"danger","كلمة المرور غير صحيحة"); return; }

  const course = (document.getElementById("wCourse").value||"").trim();
  const section= (document.getElementById("wSection").value||"").trim();
  const fromDate = (document.getElementById("fromDate").value||"").trim();
  const toDate   = (document.getElementById("toDate").value||"").trim();
  const startTime= (document.getElementById("wStartTime").value||"").trim();
  const endTime  = (document.getElementById("wEndTime").value||"").trim();
  const days = [...document.querySelectorAll(".day:checked")].map(x=>Number(x.value));

  const btn = document.getElementById("btnSchedule");
  const sp  = document.getElementById("spSchedule");
  setLoading(btn, sp, true);
  showStatus(st,"warn",t("loading"));

  const res = await apiCall({
    action:"createWeeklySchedule",
    doctorKey, course, section,
    fromDate, toDate,
    startTime, endTime,
    days
  });

  setLoading(btn, sp, false);

  if(res && res.ok){
    showStatus(st,"success","تم إنشاء الجدول الأسبوعي");
    loadLectures();
  }else{
    // هذا اللي يطلع عندك غالباً: Doctor key invalid أو Unknown action من السكربت
    showStatus(st,"danger",(res&&res.error)?res.error:t("failed"));
  }
}

async function loadLectures(){
  const doctorKey = getDoctorKey();
  const tbody = document.getElementById("lectureRows");
  tbody.innerHTML = `<tr><td colspan="6">جاري التحميل...</td></tr>`;

  const res = await apiCall({action:"listLectures", doctorKey});
  if(!res || !res.ok){
    tbody.innerHTML = `<tr><td colspan="6">${(res&&res.error)?res.error:"Failed"}</td></tr>`;
    return;
  }

  const rows = res.rows || [];
  tbody.innerHTML = rows.map(r=>`
    <tr onclick="pickLecture('${r.lectureId||""}')">
      <td><b>${r.lectureId||""}</b></td>
      <td>${r.course||""}</td>
      <td>${r.section||""}</td>
      <td>${r.start||""}</td>
      <td>${r.end||""}</td>
      <td>${r.state||""}</td>
    </tr>
  `).join("") || `<tr><td colspan="6">لا توجد محاضرات</td></tr>`;
}

function pickLecture(id){
  document.getElementById("selectedLectureId").value = id;
}

async function generateNewCode(){
  const doctorKey = getDoctorKey();
  const lectureId = (document.getElementById("selectedLectureId").value||"").trim();
  const st = document.getElementById("codeStatus");

  if(doctorKey!=="111"){ showStatus(st,"danger","كلمة المرور غير صحيحة"); return; }
  if(!lectureId){ showStatus(st,"danger","اختر LectureID أولاً"); return; }

  const btn = document.getElementById("btnCode");
  const sp  = document.getElementById("spCode");
  setLoading(btn, sp, true);
  showStatus(st,"warn",t("loading"));

  const res = await apiCall({action:"generateCode", doctorKey, lectureId});
  setLoading(btn, sp, false);

  if(res && res.ok){
    showStatus(st,"success","تم توليد كود جديد ✅");
    const code = res.code || "—";
    const qrUrl = res.qrUrl || "";
    document.getElementById("codeText").textContent = `Code: ${code}`;

    const qr = qrUrl || `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(code)}`;
    document.getElementById("qrImg").src = qr;
  }else{
    showStatus(st,"danger",(res&&res.error)?res.error:t("failed"));
  }
}

function zoomQR(){
  const src = document.getElementById("qrImg").src;
  if(!src) return;
  openQrModal(src);
}

async function showStudents(){
  const doctorKey = getDoctorKey();
  const lectureId = (document.getElementById("selectedLectureId").value||"").trim();
  const tbody = document.getElementById("studentRows");

  if(doctorKey!=="111"){ tbody.innerHTML = `<tr><td colspan="3">كلمة المرور غير صحيحة</td></tr>`; return; }
  if(!lectureId){ tbody.innerHTML = `<tr><td colspan="3">اختر LectureID أولاً</td></tr>`; return; }

  tbody.innerHTML = `<tr><td colspan="3">جاري التحميل...</td></tr>`;
  const res = await apiCall({action:"listStudentsForLecture", doctorKey, lectureId});

  if(!res || !res.ok){
    tbody.innerHTML = `<tr><td colspan="3">${(res&&res.error)?res.error:"Failed"}</td></tr>`;
    return;
  }

  const rows = res.rows || [];
  tbody.innerHTML = rows.map(r=>`
    <tr>
      <td>${r.studentId||""}</td>
      <td>${r.name||""}</td>
      <td>${r.status||""}</td>
    </tr>
  `).join("") || `<tr><td colspan="3">لا يوجد طلاب</td></tr>`;
}
</script>
</body>
</html>
