<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor - Hather</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/style.css?v=2">
  <script src="assets/app.js?v=2"></script>

  <!-- ✅ بدل CDN -->
  <script src="assets/qrcode.min.js?v=2"></script>
</head>
<body>

<div class="container">

  <div class="glass topbar">
    <div class="brand">
      <div class="logo">🏛️</div>
      <div class="brandTitle">
        <h1 data-i18n="doctor">عضو هيئة التدريس</h1>
        <p data-i18n="app_name">Hather</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn" href="index.html"><span data-i18n="back_home">الرئيسية</span></a>
      <button class="btn" onclick="lockAgain()"><span data-i18n="logout">تسجيل الخروج</span></button>
      <button class="btn primary" onclick="refreshAll()"><span data-i18n="refresh">تحديث</span></button>
    </div>
  </div>

  <!-- Login -->
  <div class="glass card" id="lockCard" style="margin-top:16px;">
    <h2 data-i18n="login">دخول</h2>
    <label data-i18n="pin">كلمة المرور (PIN)</label>
    <div class="row">
      <input id="pinInput" class="input" type="password" inputmode="numeric" autocomplete="current-password"
             data-i18n-ph="pin_placeholder" placeholder="أدخل PIN" />
      <button class="btn primary" onclick="unlock()"><span data-i18n="login">دخول</span></button>
    </div>
    <div class="status" id="lockStatus"></div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <div class="grid">

      <div class="glass card">
        <h2 data-i18n="lectures">المحاضرات</h2>

        <label data-i18n="search">بحث</label>
        <input id="searchBox" class="input" placeholder="LectureID / Course / Section" oninput="applyFilter()" />

        <div style="height:10px"></div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>LectureID</th>
                <th data-i18n="course">المقرر</th>
                <th data-i18n="section">الشعبة</th>
                <th data-i18n="start">البداية</th>
                <th data-i18n="end">النهاية</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="lectureRows">
              <tr><td colspan="6" data-i18n="loading">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="hr"></div>

        <h2 data-i18n="selected_lecture">المحاضرة المحددة</h2>

        <div class="qrGrid">
          <div class="glass card" style="margin:0;">
            <label>LectureID</label>
            <input class="input" id="selectedLectureId" placeholder="LectureID" />

            <div style="height:10px"></div>

            <div class="row">
              <button class="btn primary" onclick="generateCode()">
                <span data-i18n="generate_code">توليد رمز حضور</span>
              </button>
              <button class="btn" onclick="loadStudents()">
                <span data-i18n="show_students">عرض الطلاب</span>
              </button>
            </div>

            <div class="row" style="margin-top:10px;">
              <button class="btn danger" onclick="deleteSelectedLecture()">
                <span data-i18n="delete_lecture">حذف المحاضرة</span>
              </button>
              <button class="btn" onclick="clearSelection()">
                <span data-i18n="clear_selection">إلغاء التحديد</span>
              </button>
            </div>

            <div class="status" id="codeStatus"></div>
          </div>

          <div class="qrBox">
            <img id="qrImg" alt="QR" />
            <div class="pill" id="codeText">Code: —</div>
            <div class="qrHint">QR Code</div>
            <div class="row" style="grid-template-columns:1fr 1fr; gap:10px; width:100%;">
              <button class="btn" onclick="zoomQR()" data-i18n="qr_zoom">تكبير</button>
              <button class="btn" onclick="openQRNewTab()">فتح</button>
            </div>
          </div>
        </div>

        <div class="hr"></div>

        <h2 data-i18n="students">طلاب المحاضرة</h2>
        <div class="tableWrap">
          <table style="min-width:700px">
            <thead>
              <tr>
                <th data-i18n="student_id">الرقم الجامعي</th>
                <th>Name</th>
                <th data-i18n="status">الحالة</th>
                <th data-i18n="update">تعديل</th>
              </tr>
            </thead>
            <tbody id="studentRows">
              <tr><td colspan="4" data-i18n="select_first">اختر LectureID أولاً</td></tr>
            </tbody>
          </table>
        </div>

      </div>

      <div class="glass card">
        <h2 data-i18n="create_lecture">إنشاء محاضرة</h2>

        <div class="row">
          <div>
            <label data-i18n="course">المقرر</label>
            <input class="input" id="course" placeholder="CS111" />
          </div>
          <div>
            <label data-i18n="section">الشعبة</label>
            <input class="input" id="section" placeholder="1" />
          </div>
        </div>

        <div class="row" style="margin-top:10px">
          <div>
            <label data-i18n="start">البداية</label>
            <input class="input" id="start" type="datetime-local" />
          </div>
          <div>
            <label data-i18n="end">النهاية</label>
            <input class="input" id="end" type="datetime-local" />
          </div>
        </div>

        <div style="margin-top:10px">
          <button class="btn primary" onclick="createLecture()">
            <span data-i18n="create">إنشاء</span>
          </button>
        </div>

        <div class="status" id="createStatus"></div>

        <div class="hr"></div>

        <h2 data-i18n="update_status">تحديث الحالة</h2>
        <div class="row">
          <div>
            <label data-i18n="student_id">الرقم الجامعي</label>
            <input class="input" id="editStudentId" placeholder="44100123" />
          </div>
          <div>
            <label data-i18n="status">الحالة</label>
            <select class="input" id="editStatus">
              <option value="حضور">حضور</option>
              <option value="تأخير">تأخير</option>
              <option value="غياب">غياب</option>
            </select>
          </div>
        </div>

        <div style="margin-top:10px">
          <button class="btn primary" onclick="updateStudentStatus()">
            <span data-i18n="update_status">تحديث</span>
          </button>
        </div>

        <div class="status" id="editStatusMsg"></div>
      </div>

    </div>

    <div class="footer">Hather Attendance System © 2026</div>
  </div>
</div>

<div class="modal" id="qrModal" onclick="closeModal()">
  <div class="modalCard" onclick="event.stopPropagation()">
    <img id="qrBig" alt="QR Big">
    <div style="height:12px"></div>
    <button class="btn primary" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  HATHER.applyI18n();
  const $ = HATHER.qs;

  let DOCTOR_PIN = "";
  let ALL_LECTURES = [];
  let LAST_QR_SRC = "";

  function showStatus(el, type, msg){ el.className="status show "+(type||""); el.textContent=msg||""; }
  function hideStatus(el){ el.className="status"; el.textContent=""; }

  async function unlock(){
    DOCTOR_PIN = ($("pinInput").value||"").trim();
    const st = $("lockStatus"); hideStatus(st);
    if(!DOCTOR_PIN){ showStatus(st,"bad","PIN"); return; }

    try{
      const res = await HATHER.apiPost({ action:"listLectures", doctorKey: DOCTOR_PIN });
      if(!res || !res.ok){ showStatus(st,"bad",HATHER.t("wrong_pin")); return; }
      $("lockCard").classList.add("hidden");
      $("app").classList.remove("hidden");
      await refreshAll();
    }catch(e){ showStatus(st,"bad",HATHER.t("api_error")); }
  }

  function lockAgain(){
    $("pinInput").value=""; DOCTOR_PIN="";
    $("lockCard").classList.remove("hidden");
    $("app").classList.add("hidden");
  }

  function clearSelection(){
    $("selectedLectureId").value="";
    $("codeText").textContent="Code: —";
    $("qrImg").removeAttribute("src");
    LAST_QR_SRC = "";
    $("studentRows").innerHTML = `<tr><td colspan="4">${HATHER.t("select_first")}</td></tr>`;
    document.querySelectorAll("#lectureRows tr").forEach(tr => tr.classList.remove("active"));
  }

  function pickLecture(id){
    $("selectedLectureId").value=id;
    document.querySelectorAll("#lectureRows tr").forEach(tr => tr.classList.remove("active"));
    const tr = document.querySelector(`#lectureRows tr[data-id="${CSS.escape(id)}"]`);
    if(tr) tr.classList.add("active");
  }

  function applyFilter(){
    const q = ($("searchBox").value||"").trim().toLowerCase();
    const filtered = !q ? ALL_LECTURES : ALL_LECTURES.filter(r=>{
      return String(r.lectureId||"").toLowerCase().includes(q) ||
             String(r.course||"").toLowerCase().includes(q) ||
             String(r.section||"").toLowerCase().includes(q);
    });
    renderLectures(filtered);
  }

  function renderLectures(rows){
    const tbody=$("lectureRows");
    if(!rows || rows.length===0){ tbody.innerHTML=`<tr><td colspan="6">${HATHER.t("no_data")}</td></tr>`; return; }
    tbody.innerHTML = rows.map(r=>`
      <tr data-id="${r.lectureId}" onclick="pickLecture('${String(r.lectureId).replace(/'/g,"\\'")}')">
        <td><b>${r.lectureId||""}</b></td>
        <td>${r.course||""}</td>
        <td>${r.section||""}</td>
        <td>${r.start||""}</td>
        <td>${r.end||""}</td>
        <td>${r.state||""}</td>
      </tr>
    `).join("");
  }

  async function refreshAll(){
    await loadLectures();
    try{ await HATHER.apiHealth(); }catch(e){}
  }

  async function loadLectures(){
    const tbody=$("lectureRows");
    tbody.innerHTML=`<tr><td colspan="6">${HATHER.t("loading")}</td></tr>`;
    try{
      const res = await HATHER.apiPost({ action:"listLectures", doctorKey: DOCTOR_PIN });
      if(!res || !res.ok){ tbody.innerHTML=`<tr><td colspan="6">${res && res.error ? res.error : "Failed"}</td></tr>`; return; }
      ALL_LECTURES = (res.rows||[]).filter(x => String(x.state||"").toLowerCase() !== "deleted");
      applyFilter();
    }catch(e){
      tbody.innerHTML=`<tr><td colspan="6">${HATHER.t("api_error")}</td></tr>`;
    }
  }

  async function createLecture(){
    const st=$("createStatus"); hideStatus(st);
    const course=($("course").value||"").trim();
    const section=($("section").value||"").trim();
    const start=($("start").value||"").trim();
    const end=($("end").value||"").trim();
    if(!course||!section||!start||!end){ showStatus(st,"bad","Fields"); return; }
    showStatus(st,"warn",HATHER.t("loading"));
    try{
      const res=await HATHER.apiPost({ action:"createLecture", doctorKey: DOCTOR_PIN, course, section, start, end });
      if(res && res.ok){ showStatus(st,"ok","OK"); await loadLectures(); }
      else showStatus(st,"bad",(res && res.error) ? res.error : "Failed");
    }catch(e){ showStatus(st,"bad",HATHER.t("api_error")); }
  }

  async function generateCode(){
    const st=$("codeStatus"); hideStatus(st);

    const lectureId=($("selectedLectureId").value||"").trim();
    if(!lectureId){ showStatus(st,"bad",HATHER.t("select_first")); return; }

    showStatus(st,"warn",HATHER.t("loading"));
    try{
      const res=await HATHER.apiPost({ action:"generateCode", doctorKey: DOCTOR_PIN, lectureId });
      if(!(res && res.ok)){ showStatus(st,"bad",(res && res.error) ? res.error : "Failed"); return; }

      $("codeText").textContent="Code: "+(res.code||"—");

      const qrText = (res.qrText && String(res.qrText).trim())
        ? String(res.qrText).trim()
        : JSON.stringify({ lectureId, code: res.code });

      // ✅ توليد QR من الملف المحلي (بدون CDN)
      const src = await (window.QR_LOCAL ? QR_LOCAL.toDataURL(qrText, { width: 360 }) : Promise.reject("no QR_LOCAL"));
      LAST_QR_SRC = src;
      $("qrImg").src = src;

      showStatus(st,"ok","OK");
    }catch(e){
      // ✅ حتى لو فشل dataURL، نحط URL مباشر للـ Google Chart كآخر حل
      const lectureId2=($("selectedLectureId").value||"").trim();
      const codeTxt = ($("codeText").textContent||"").replace("Code:","").trim();
      const qrText = JSON.stringify({ lectureId: lectureId2, code: codeTxt });
      const fallback = "https://chart.googleapis.com/chart?cht=qr&chs=360x360&chl=" + encodeURIComponent(qrText);
      LAST_QR_SRC = fallback;
      $("qrImg").src = fallback;

      // لو حتى الصورة ما ظهرت بسبب حظر الشبكة، المستخدم يقدر يفتحها بزر "فتح"
      showStatus(st,"warn","QR fallback used");
    }
  }

  async function deleteSelectedLecture(){
    const lectureId=($("selectedLectureId").value||"").trim();
    const st=$("codeStatus"); hideStatus(st);
    if(!lectureId){ showStatus(st,"bad",HATHER.t("select_first")); return; }
    if(!confirm("Confirm?")) return;
    showStatus(st,"warn",HATHER.t("loading"));
    try{
      const res=await HATHER.apiPost({ action:"deleteLecture", doctorKey: DOCTOR_PIN, lectureId });
      if(res && res.ok){ showStatus(st,"ok","OK"); clearSelection(); await loadLectures(); }
      else showStatus(st,"bad",(res && res.error)?res.error:"Failed");
    }catch(e){ showStatus(st,"bad",HATHER.t("api_error")); }
  }

  async function loadStudents(){
    const tbody=$("studentRows");
    const lectureId=($("selectedLectureId").value||"").trim();
    if(!lectureId){ tbody.innerHTML=`<tr><td colspan="4">${HATHER.t("select_first")}</td></tr>`; return; }
    tbody.innerHTML=`<tr><td colspan="4">${HATHER.t("loading")}</td></tr>`;
    try{
      const res=await HATHER.apiPost({ action:"listStudentsForLecture", doctorKey: DOCTOR_PIN, lectureId });
      if(!res || !res.ok){ tbody.innerHTML=`<tr><td colspan="4">${(res && res.error)?res.error:"Failed"}</td></tr>`; return; }
      const rows=res.rows||[];
      if(rows.length===0){ tbody.innerHTML=`<tr><td colspan="4">${HATHER.t("no_data")}</td></tr>`; return; }
      tbody.innerHTML=rows.map(r=>`
        <tr>
          <td>${r.studentId||""}</td>
          <td>${r.name||""}</td>
          <td>${r.status||""}</td>
          <td>
            <button class="btn" style="padding:8px 10px;border-radius:14px;" onclick="quickSetStatus('${String(r.studentId).replace(/'/g,"\\'")}','حضور')">حضور</button>
            <button class="btn" style="padding:8px 10px;border-radius:14px;" onclick="quickSetStatus('${String(r.studentId).replace(/'/g,"\\'")}','تأخير')">تأخير</button>
            <button class="btn danger" style="padding:8px 10px;border-radius:14px;" onclick="quickSetStatus('${String(r.studentId).replace(/'/g,"\\'")}','غياب')">غياب</button>
          </td>
        </tr>
      `).join("");
    }catch(e){
      tbody.innerHTML=`<tr><td colspan="4">${HATHER.t("api_error")}</td></tr>`;
    }
  }

  function quickSetStatus(studentId, status){
    $("editStudentId").value=studentId;
    $("editStatus").value=status;
    updateStudentStatus();
  }

  async function updateStudentStatus(){
    const msg=$("editStatusMsg"); hideStatus(msg);
    const lectureId=($("selectedLectureId").value||"").trim();
    const studentId=($("editStudentId").value||"").trim();
    const status=($("editStatus").value||"").trim();
    if(!lectureId){ showStatus(msg,"bad",HATHER.t("select_first")); return; }
    if(!studentId){ showStatus(msg,"bad","StudentID"); return; }

    showStatus(msg,"warn",HATHER.t("loading"));
    try{
      const res=await HATHER.apiPost({ action:"updateAttendanceStatus", doctorKey: DOCTOR_PIN, lectureId, studentId, status });
      if(res && res.ok){ showStatus(msg,"ok","OK"); await loadStudents(); }
      else showStatus(msg,"bad",(res && res.error)?res.error:"Failed");
    }catch(e){ showStatus(msg,"bad",HATHER.t("api_error")); }
  }

  function zoomQR(){
    if(!LAST_QR_SRC){ alert("No QR"); return; }
    $("qrBig").src = LAST_QR_SRC;
    $("qrModal").classList.add("show");
  }
  function openQRNewTab(){
    if(!LAST_QR_SRC){ alert("No QR"); return; }
    window.open(LAST_QR_SRC, "_blank");
  }
  function closeModal(){ $("qrModal").classList.remove("show"); }
</script>

</body>
</html>
