<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hather - حاضر</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#0d2c1a 0%, #1a472a 45%, #2d7d46 100%);
  display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;
}
.card{
  width:100%;max-width:460px;border-radius:18px;padding:22px;
  background:rgba(13,44,26,.62); /* أفتح */
  box-shadow:0 18px 45px rgba(0,0,0,.30);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(10px);
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:900;opacity:.95}
.icon-btn{
  border:none;cursor:pointer;width:44px;height:44px;border-radius:12px;
  background:rgba(255,255,255,.14);
  color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{transform:scale(.98)}
.icon-btn .sub{font-size:12px;opacity:.92;margin-left:6px}
.header{text-align:center;padding-bottom:14px;margin-bottom:16px;position:relative}
.header::after{
  content:'';position:absolute;bottom:0;left:15%;right:15%;height:2px;
  background:linear-gradient(to right,transparent,rgba(76,201,135,.95),transparent);
}
.title{
  font-size:46px;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(135deg,#b9ffd9,#4cc987);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{margin-top:6px;font-size:20px;font-weight:900;color:#e7fff3;opacity:.98}
.hint{margin-top:10px;font-size:14px;color:rgba(255,255,255,.82)}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.btn{
  width:100%;padding:16px 14px;border:none;border-radius:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;color:#fff;
  font-weight:900;font-size:18px;
  box-shadow:0 10px 22px rgba(0,0,0,.18);
  transition:transform .15s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.student{background:linear-gradient(135deg,#1a472a,#2d7d46,#4cc987)}
.btn.reports{background:linear-gradient(135deg,#0e3b24,#1f6b43)}
.btn.doctor{background:linear-gradient(135deg,#244b3a,#0d2c1a)}
.btn .meta{font-size:13px;font-weight:800;opacity:.92;margin-top:3px}
.footer{margin-top:14px;text-align:center;font-size:12px;color:rgba(255,255,255,.75)}
</style>
</head>

<body>
<div class="card">
  <div class="topbar">
    <div class="brand">Hather</div>
    <button class="icon-btn" id="langBtn" aria-label="Toggle language">
      🌐 <span id="langBadge" class="sub">EN</span>
    </button>
  </div>

  <div class="header">
    <div class="title">Hather</div>
    <div class="subtitle" id="subTitle">حاضر</div>
    <div class="hint" id="hint">اختر القسم المناسب للمتابعة</div>
  </div>

  <div class="menu">
    <button class="btn student" onclick="location.href='student.html'">
      <div>
        <div id="b1">قسم الطالب</div>
        <div class="meta" id="b1m">تسجيل الحضور</div>
      </div>
      <div>➜</div>
    </button>

    <button class="btn reports" onclick="location.href='reports.html'">
      <div>
        <div id="b2">تقارير الطالب</div>
        <div class="meta" id="b2m">نسبة الحضور والتأخير</div>
      </div>
      <div>➜</div>
    </button>

    <button class="btn doctor" onclick="location.href='doctor.html'">
      <div>
        <div id="b3">قسم الدكتور</div>
        <div class="meta" id="b3m">إدارة المحاضرات والتقارير</div>
      </div>
      <div>➜</div>
    </button>
  </div>

  <div class="footer" id="footer">نظام حضور بسيط وعملي</div>
</div>

<script>
const STR = {
  ar:{dir:"rtl",lang:"ar",badge:"EN",
    subTitle:"حاضر",
    hint:"اختر القسم المناسب للمتابعة",
    b1:"قسم الطالب",b1m:"تسجيل الحضور",
    b2:"تقارير الطالب",b2m:"نسبة الحضور والتأخير",
    b3:"قسم الدكتور",b3m:"إدارة المحاضرات والتقارير",
    footer:"نظام حضور بسيط وعملي"
  },
  en:{dir:"ltr",lang:"en",badge:"AR",
    subTitle:"Attendance",
    hint:"Choose the section to continue",
    b1:"Student",b1m:"Check-in",
    b2:"Student Reports",b2m:"Attendance & lateness",
    b3:"Doctor",b3m:"Manage lectures & reports",
    footer:"Simple & practical attendance system"
  }
};
function getLang(){ return localStorage.getItem("hather_lang") || "ar"; }
function setLang(l){ localStorage.setItem("hather_lang", l); }
function applyLang(){
  const l=getLang(), t=STR[l];
  document.documentElement.lang=t.lang;
  document.documentElement.dir=t.dir;
  document.getElementById("langBadge").textContent=t.badge;
  document.getElementById("subTitle").textContent=t.subTitle;
  document.getElementById("hint").textContent=t.hint;
  document.getElementById("b1").textContent=t.b1;
  document.getElementById("b1m").textContent=t.b1m;
  document.getElementById("b2").textContent=t.b2;
  document.getElementById("b2m").textContent=t.b2m;
  document.getElementById("b3").textContent=t.b3;
  document.getElementById("b3m").textContent=t.b3m;
  document.getElementById("footer").textContent=t.footer;
}
document.getElementById("langBtn").addEventListener("click",()=>{
  setLang(getLang()==="ar"?"en":"ar"); applyLang();
});
applyLang();
</script>
</body>
</html>
