<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hather - حاضر</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI','Arial',sans-serif;
}

body{
background:linear-gradient(135deg,#0d2c1a 0%,#1a472a 50%,#2d7d46 100%);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.app-container{
width:100%;
max-width:380px;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
position:relative;
}

.header{
margin-bottom:35px;
text-align:center;
padding-bottom:20px;
position:relative;
}

.header::after{
content:'';
position:absolute;
bottom:0;
left:15%;
right:15%;
height:2px;
background:linear-gradient(to right,transparent,#2d7d46,transparent);
}

.app-title{
font-size:42px;
font-weight:800;
background:linear-gradient(135deg,#0d2c1a,#2d7d46);
-webkit-background-clip:text;
color:transparent;
margin-bottom:8px;
}

.app-title-ar{
font-size:34px;
font-weight:700;
background:linear-gradient(135deg,#1a472a,#3a9e5f);
-webkit-background-clip:text;
color:transparent;
}

.form-group{
margin-bottom:25px;
}

.label-en{
font-size:15px;
color:#1a472a;
display:block;
text-align:left;
}

.label-ar{
font-size:18px;
font-weight:700;
color:#0d2c1a;
margin-bottom:8px;
display:block;
}

.input-field{
width:100%;
padding:14px 16px;
border:2px solid #d1e7dd;
border-radius:10px;
font-size:16px;
background:#f8fff8;
direction:ltr;
}

.input-field:focus{
outline:none;
border-color:#2d7d46;
box-shadow:0 0 0 3px rgba(45,125,70,.2);
}

.checkin-btn{
width:100%;
padding:16px;
background:linear-gradient(135deg,#1a472a,#2d7d46,#3a9e5f);
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
box-shadow:0 5px 15px rgba(26,71,42,.3);
}

.checkin-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

/* ===== مربع التحضير (من الكود الثاني) ===== */

#status-container{
margin-top:15px;
text-align:center;
min-height:40px;
}

#status-msg{
font-weight:700;
}

#spinner{
width:26px;
height:26px;
border:3px solid #d1e7dd;
border-top:3px solid #2d7d46;
border-radius:50%;
animation:spin 1s linear infinite;
margin:0 auto 8px;
display:none;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

.shake{
animation:shake .3s;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-5px);}
50%{transform:translateX(5px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}
</style>
</head>

<body>

<div class="app-container">
  <div class="header">
    <div class="app-title">Hather</div>
    <div class="app-title-ar">حاضر</div>
  </div>

  <div class="form-group">
    <span class="label-en">Enter university ID</span>
    <span class="label-ar">ادخل الرقم الجامعي</span>
    <input id="studentId" class="input-field" maxlength="9" inputmode="numeric">
  </div>

  <button class="checkin-btn" id="btn">تسجيل الحضور</button>

  <div id="status-container">
    <div id="spinner"></div>
    <div id="status-msg"></div>
  </div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwVkvAhB49J2xaJE4ZqZN7NKAOqT_G1uyx76M3otmJH-vB-mwghmUoWQi2AB4kB1Hk_/exec";

const btn = document.getElementById("btn");
const input = document.getElementById("studentId");
const msg = document.getElementById("status-msg");
const spinner = document.getElementById("spinner");

btn.onclick = () => {
const id = input.value.trim();

if(!/^\d{9}$/.test(id)){
msg.style.color="#c0392b";
msg.textContent="❌ الرقم الجامعي يجب أن يكون 9 أرقام";
input.classList.add("shake");
setTimeout(()=>input.classList.remove("shake"),300);
return;
}

btn.disabled=true;
spinner.style.display="block";
msg.style.color="#1a472a";
msg.textContent="⏳ جاري تسجيل الحضور...";

fetch(scriptURL,{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ studentId:id })
})
.then(()=> {
msg.style.color="#2d7d46";
msg.textContent="✅ تم تسجيل الحضور بنجاح";
input.value="";
})
.catch(()=>{
msg.style.color="#c0392b";
msg.textContent="❌ حدث خطأ أثناء التسجيل";
})
.finally(()=>{
spinner.style.display="none";
btn.disabled=false;
});
};
</script>

</body>
</html>
