<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-left">
        <div class="logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="rgba(255,255,255,.9)" stroke-width="1.8"/>
            <path d="M8 12l2.2 2.2L16.5 8" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-titles">
          <h1 data-i18n="homeTitle">Hather</h1>
          <p data-i18n="homeSub">نظام إدارة الحضور الأكاديمي</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="lang-chip" onclick="toggleLang()">
          <span>AR/EN</span>
        </div>
      </div>
    </div>

    <div class="grid-center">
      <div class="card">
        <div class="card-title">
          <p class="title" style="margin:0" data-i18n="homeTitle">Hather</p>
          <p class="subtitle" data-i18n="homeSub">نظام إدارة الحضور الأكاديمي</p>
        </div>
        <div class="hr"></div>

        <button class="btn primary" onclick="location.href='student.html'">
          <div class="left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
              <path d="M4 22a8 8 0 0 1 16 0" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="text">
            <span data-i18n="toStudent">قسم الطالب</span>
            <span class="sub" data-i18n="toStudentSub">تسجيل حضور المحاضرة</span>
          </div>
        </button>

        <div style="height:10px"></div>

        <button class="btn" onclick="location.href='student-report.html'">
          <div class="left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 19V5" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
              <path d="M4 19H20" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 15V11" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
              <path d="M12 15V7" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
              <path d="M16 15V9" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="text">
            <span data-i18n="toReport">تقارير الطالب</span>
            <span class="sub" data-i18n="toReportSub">نسبة الحضور والتأخير</span>
          </div>
        </button>

        <div style="height:10px"></div>

        <button class="btn dark" onclick="location.href='doctor.html'">
          <div class="left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 2a4 4 0 0 1 4 4v2h-8V6a4 4 0 0 1 4-4Z" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
              <path d="M6 22v-8a6 6 0 0 1 12 0v8" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="text">
            <span data-i18n="toDoctor">لوحة عضو هيئة التدريس</span>
            <span class="sub" data-i18n="toDoctorSub">إدارة المحاضرات والرموز</span>
          </div>
        </button>

      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>applyLang();</script>
</body>
</html>
