<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hather - حاضر</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Arial', sans-serif;
}

body {
    background: linear-gradient(135deg, #0b2416 0%, #174c30 50%, #2f8f55 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* مربع التحضير */
.app-container {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: rgba(244, 251, 247, 0.96);
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.app-container::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    background: linear-gradient(135deg, #0e3b24, #1f6b43, #3aa76a);
    border-radius: 18px;
    z-index: -1;
    opacity: 0.35;
}

/* العنوان */
.header {
    margin-bottom: 35px;
    text-align: center;
    position: relative;
    padding-bottom: 20px;
}

.header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 15%;
    right: 15%;
    height: 2px;
    background: linear-gradient(to right, transparent, #2f8f55, transparent);
}

.app-title {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, #0e3b24, #2f8f55);
    -webkit-background-clip: text;
    color: transparent;
}

.app-title-ar {
    font-size: 34px;
    font-weight: 700;
    background: linear-gradient(135deg, #1f6b43, #4cc987);
    -webkit-background-clip: text;
    color: transparent;
}

/* الإدخال */
.form-group {
    margin-bottom: 28px;
}

.label-en {
    font-size: 15px;
    color: #1f6b43;
    margin-bottom: 6px;
    display: block;
    text-align: left;
}

.label-ar {
    font-size: 18px;
    font-weight: 700;
    color: #0e3b24;
    margin-bottom: 10px;
    display: block;
}

.input-field {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #cfe8da;
    border-radius: 10px;
    font-size: 18px;
    direction: ltr;
    background: #f8fffb;
}

.input-field:focus {
    outline: none;
    border-color: #2f8f55;
    box-shadow: 0 0 0 3px rgba(47, 143, 85, 0.2);
}

/* زر التحضير */
.checkin-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #1b5e3b, #2f8f55, #4cc987);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(27, 94, 59, 0.35);
}

.checkin-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* حالة الرسائل */
#status-container {
    margin-top: 15px;
    text-align: center;
    min-height: 34px;
}

#status-msg {
    font-weight: bold;
}

#spinner {
    width: 26px;
    height: 26px;
    border: 3px solid #cfe8da;
    border-top: 3px solid #2f8f55;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 6px;
    display: none;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.shake {
    animation: shake 0.3s;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div class="app-container">
    <div class="header">
        <div class="app-title">Hather</div>
        <div class="app-title-ar">حاضر</div>
    </div>

    <div class="form-group">
        <span class="label-en">Enter university ID</span>
        <span class="label-ar">ادخل الرقم الجامعي</span>
        <input class="input-field" maxlength="9" inputmode="numeric">
    </div>

    <button class="checkin-btn">تسجيل الحضور</button>

    <div id="status-container">
        <div id="spinner"></div>
        <p id="status-msg"></p>
    </div>
</div>

<script>
const scriptURL = "ضع_رابط_Google_Script_هنا";

const btn = document.querySelector(".checkin-btn");
const input = document.querySelector(".input-field");
const msg = document.getElementById("status-msg");
const spinner = document.getElementById("spinner");

btn.addEventListener("click", () => {
    const id = input.value.trim();

    if (!/^[0-9]{9}$/.test(id)) {
        msg.style.color = "#c0392b";
        msg.textContent = "❌ الرقم الجامعي يجب أن يكون 9 أرقام";
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 300);
        return;
    }

    btn.disabled = true;
    spinner.style.display = "block";
    msg.style.color = "#1f6b43";
    msg.textContent = "⏳ جارٍ تسجيل الحضور...";

    fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify({ studentId: id })
    })
    .then(() => {
        msg.style.color = "#1e7f4f";
        msg.textContent = "✅ تم تسجيل الحضور بنجاح";
        input.value = "";
    })
    .catch(() => {
        msg.style.color = "#c0392b";
        msg.textContent = "❌ حدث خطأ أثناء التسجيل";
    })
    .finally(() => {
        spinner.style.display = "none";
        btn.disabled = false;
    });
});
</script>

</body>
</html>
