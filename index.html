<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hather - حاضر</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #0d2c1a, #2d7d46);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.app-container {
  background: #fff;
  width: 100%;
  max-width: 380px;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

.app-title {
  font-size: 40px;
  font-weight: 800;
  color: #1a472a;
}

.app-title-ar {
  font-size: 30px;
  font-weight: 700;
  color: #2d7d46;
}

.form-group {
  margin-bottom: 20px;
}

.label-en {
  font-size: 14px;
  display: block;
  color: #444;
}

.label-ar {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.input-field {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  border-radius: 10px;
  border: 2px solid #d1e7dd;
  text-align: left;
  direction: ltr;
}

.checkin-btn {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  background: #2d7d46;
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.checkin-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

/* حالة الرسائل */
#status-container {
  text-align: center;
  margin-top: 15px;
  min-height: 30px;
}

#status-msg {
  font-weight: bold;
}

#spinner {
  width: 24px;
  height: 24px;
  border: 3px solid #d1e7dd;
  border-top: 3px solid #2d7d46;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto;
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.shake {
  animation: shake 0.3s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div class="app-container">
  <div class="header">
    <div class="app-title">Hather</div>
    <div class="app-title-ar">حاضر</div>
  </div>

  <div class="form-group">
    <span class="label-en">Enter university ID</span>
    <span class="label-ar">ادخل الرقم الجامعي</span>
    <input class="input-field" maxlength="9" inputmode="numeric">
  </div>

  <button class="checkin-btn">تسجيل الحضور</button>

  <div id="status-container">
    <div id="spinner"></div>
    <p id="status-msg"></p>
  </div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzfZskTr8t9V1lynYQB_FkydWuz8EHQrEppon3Kjt3743JwrDjVzraH2FtlIzhmyMOnEg/exec";

const btn = document.querySelector(".checkin-btn");
const input = document.querySelector(".input-field");
const msg = document.getElementById("status-msg");
const spinner = document.getElementById("spinner");

btn.addEventListener("click", () => {
  const id = input.value.trim();

  if (!/^[0-9]{9}$/.test(id)) {
    msg.style.color = "red";
    msg.textContent = "❌ الرقم الجامعي يجب أن يكون 9 أرقام";
    input.classList.add("shake");
    setTimeout(() => input.classList.remove("shake"), 300);
    return;
  }

  btn.disabled = true;
  spinner.style.display = "block";
  msg.style.color = "#1a472a";
  msg.textContent = "⏳ جارٍ تسجيل الحضور...";

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify({
      studentId: id,
      device: navigator.userAgent
    })
  })
  .then(() => {
    msg.style.color = "green";
    msg.textContent = "✅ تم تسجيل الحضور بنجاح";
    input.value = "";
  })
  .catch(() => {
    msg.style.color = "red";
    msg.textContent = "❌ حدث خطأ أثناء التسجيل";
  })
  .finally(() => {
    spinner.style.display = "none";
    btn.disabled = false;
  });
});
</script>

</body>
</html>
