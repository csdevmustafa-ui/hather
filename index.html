<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hather - حاضر</title>

<style>
body{
background:linear-gradient(135deg,#0d2c1a,#1a472a,#2d7d46);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
font-family:Arial;
}

.app{
background:white;
padding:25px;
border-radius:14px;
width:320px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:15px 0;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#1a472a;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

#msg{margin-top:10px;font-weight:bold;}
.success{color:green;}
.error{color:red;}
</style>
</head>

<body>

<div class="app">
<h2>Hather</h2>
<h3>حاضر</h3>

<input id="studentId" placeholder="الرقم الجامعي (9 أرقام)">
<button onclick="send()">تسجيل</button>
<div id="msg"></div>
</div>

<script>
const scriptURL = "PUT_SCRIPT_URL_HERE";

function send(){
const id = document.getElementById("studentId").value.trim();
const msg = document.getElementById("msg");

if(!/^\d{9}$/.test(id)){
msg.textContent="❌ الرقم غير صحيح";
msg.className="error";
return;
}

fetch(scriptURL,{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ studentId:id })
})
.then(r=>r.json())
.then(d=>{
if(d.success){
msg.textContent="✅ تم تسجيل الحضور";
msg.className="success";
}else{
throw 0;
}
})
.catch(()=>{
msg.textContent="❌ فشل التسجيل";
msg.className="error";
});
}
</script>

</body>
</html>
