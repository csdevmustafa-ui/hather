<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=1">
  <script src="assets/app.js?v=1"></script>
</head>
<body>

<div class="container">
  <div class="glass topbar">
    <div class="brand">
      <div class="logo">🏛️</div>
      <div class="brandTitle">
        <h1 data-i18n="home_title">نظام إدارة الحضور</h1>
        <p data-i18n="home_sub">جامعة الحدود الشمالية</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="langBtn" data-i18n="choose_lang">اختر اللغة</button>
    </div>
  </div>

  <div class="homeGrid">
    <div class="glass tile">
      <h2 data-i18n="doctor">عضو هيئة التدريس</h2>
      <p>لوحة إدارة المحاضرات، توليد رمز الحضور، وإدارة حالات الطلاب.</p>
      <a class="btn primary" href="doctor.html"><span data-i18n="open">دخول</span></a>
    </div>

    <div class="glass tile">
      <h2 data-i18n="student">الطالب</h2>
      <p>تسجيل الحضور باستخدام الرمز أو عبر الكاميرا (QR).</p>
      <a class="btn primary" href="student.html"><span data-i18n="open">دخول</span></a>
    </div>

    <div class="glass tile">
      <h2 data-i18n="reports">التقارير</h2>
      <p>تقرير المقرر لعضو هيئة التدريس وتقرير الطالب.</p>
      <a class="btn primary" href="reports.html"><span data-i18n="open">دخول</span></a>
    </div>
  </div>

  <div class="footer">Hather Attendance System © 2026</div>
</div>

<script>
  function init(){
    HATHER.applyI18n();
    const btn = document.getElementById("langBtn");
    btn.onclick = () => {
      const next = (HATHER.getLang() === "ar") ? "en" : "ar";
      HATHER.setLang(next);
      HATHER.applyI18n();
    };
  }
  init();
</script>

</body>
</html>
