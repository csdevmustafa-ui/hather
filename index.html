<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hather - حاضر</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI','Arial',sans-serif;
}

body{
background:linear-gradient(135deg,#0d2c1a 0%,#1a472a 50%,#2d7d46 100%);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.app-container{
width:100%;
max-width:380px;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
position:relative;
}

.header{
text-align:center;
margin-bottom:30px;
}

.app-title{
font-size:42px;
font-weight:800;
background:linear-gradient(135deg,#0d2c1a,#2d7d46);
-webkit-background-clip:text;
color:transparent;
}

.app-title-ar{
font-size:34px;
font-weight:700;
background:linear-gradient(135deg,#1a472a,#3a9e5f);
-webkit-background-clip:text;
color:transparent;
}

.form-group{
margin-bottom:25px;
}

.label-en{
font-size:15px;
color:#1a472a;
display:block;
text-align:left;
}

.label-ar{
font-size:18px;
font-weight:700;
color:#0d2c1a;
margin-bottom:8px;
display:block;
}

.input-field{
width:100%;
padding:14px;
border:2px solid #d1e7dd;
border-radius:10px;
font-size:16px;
background:#f8fff8;
}

.checkin-btn{
width:100%;
padding:16px;
background:linear-gradient(135deg,#1a472a,#2d7d46,#3a9e5f);
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.checkin-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
margin-top:15px;
text-align:center;
font-weight:700;
}

.success{color:#2d7d46;}
.error{color:#c0392b;}
.wait{color:#e67e22;}
</style>
</head>

<body>

<div class="app-container">
<div class="header">
<div class="app-title">Hather</div>
<div class="app-title-ar">حاضر</div>
</div>

<div class="form-group">
<span class="label-en">Enter university ID</span>
<span class="label-ar">ادخل الرقم الجامعي</span>
<input id="studentId" type="text" class="input-field" placeholder="9 digits">
</div>

<button class="checkin-btn" onclick="submitAttendance()">
تسجيل الحضور
</button>

<div id="msg" class="message"></div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxjWP-EpShxduM6PuWXAdnCHFMeISrGA3FVSVpthosrVm30wQzW4sCQ2V8YY9MlOhl0/exec";

function submitAttendance(){
const id = document.getElementById("studentId").value.trim();
const msg = document.getElementById("msg");
const btn = document.querySelector(".checkin-btn");

if(!/^\d{9}$/.test(id)){
msg.textContent="❌ الرقم الجامعي غير صحيح";
msg.className="message error";
return;
}

msg.textContent="⏳ جاري تسجيل الحضور...";
msg.className="message wait";
btn.disabled=true;

fetch(scriptURL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
studentId:id,
device:navigator.userAgent
})
})
.then(res=>res.json())
.then(()=>{
msg.textContent="✅ تم تسجيل الحضور بنجاح";
msg.className="message success";
btn.disabled=false;
})
.catch(()=>{
msg.textContent="❌ حدث خطأ، حاول مرة أخرى";
msg.className="message error";
btn.disabled=false;
});
}
</script>

</body>
</html>
