<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hather - حاضر</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #0d2c1a 0%, #1a472a 50%, #2d7d46 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.app-container {
  width: 100%;
  max-width: 380px;
  background: rgba(255,255,255,.95);
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

.app-title {
  font-size: 40px;
  font-weight: 800;
  color: #0d2c1a;
}

.app-title-ar {
  font-size: 30px;
  font-weight: 700;
  color: #2d7d46;
}

.form-group {
  margin-bottom: 20px;
}

.label-en {
  display: block;
  font-size: 14px;
  color: #444;
}

.label-ar {
  display: block;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}

.input-field {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  border-radius: 10px;
  border: 2px solid #d1e7dd;
  direction: ltr;
  text-align: left;
}

.checkin-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #1a472a, #2d7d46);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

.checkin-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#status {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
  min-height: 24px;
}

.spinner {
  width: 22px;
  height: 22px;
  border: 3px solid #d1e7dd;
  border-top: 3px solid #2d7d46;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 10px auto;
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="app-container">
  <div class="header">
    <div class="app-title">Hather</div>
    <div class="app-title-ar">حاضر</div>
  </div>

  <div class="form-group">
    <span class="label-en">University ID</span>
    <span class="label-ar">الرقم الجامعي</span>
    <input id="studentId" class="input-field" maxlength="9" inputmode="numeric">
  </div>

  <div class="form-group">
    <span class="label-en">Lecture ID</span>
    <span class="label-ar">رمز المحاضرة</span>
    <input id="lectureId" class="input-field">
  </div>

  <button id="btn" class="checkin-btn">تسجيل الحضور</button>

  <div class="spinner" id="spinner"></div>
  <div id="status"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxp191jvUZD8QwjUR-NG7VJduAhAVFssssjU62MKvf2Pf748ZzZ0ccd_eVJvsWI1lgL/exec";

const btn = document.getElementById("btn");
const studentInput = document.getElementById("studentId");
const lectureInput = document.getElementById("lectureId");
const statusDiv = document.getElementById("status");
const spinner = document.getElementById("spinner");

btn.addEventListener("click", () => {
  const studentId = studentInput.value.trim();
  const lectureId = lectureInput.value.trim();

  if (!/^[0-9]{9}$/.test(studentId)) {
    statusDiv.style.color = "red";
    statusDiv.textContent = "❌ الرقم الجامعي يجب أن يكون 9 أرقام";
    return;
  }

  if (!lectureId) {
    statusDiv.style.color = "red";
    statusDiv.textContent = "❌ أدخل رمز المحاضرة";
    return;
  }

  btn.disabled = true;
  spinner.style.display = "block";
  statusDiv.style.color = "#1a472a";
  statusDiv.textContent = "⏳ جارٍ تسجيل الحضور...";

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      studentId: studentId,
      lectureId: lectureId
    })
  })
  .then(res => res.json())
  .then(data => {
    statusDiv.style.color = "green";
    statusDiv.textContent = "✅ " + data.result;
    studentInput.value = "";
  })
  .catch(() => {
    statusDiv.style.color = "red";
    statusDiv.textContent = "❌ حدث خطأ أثناء التسجيل";
  })
  .finally(() => {
    spinner.style.display = "none";
    btn.disabled = false;
  });
});
</script>

</body>
</html>
