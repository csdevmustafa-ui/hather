
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hather - حاضر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0d2c1a 0%, #1a472a 50%, #2d7d46 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .app-container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header {
            margin-bottom: 35px;
            text-align: center;
            position: relative;
            padding-bottom: 20px;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(to right, transparent, #2d7d46, transparent);
        }
        
        .app-title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #0d2c1a, #2d7d46);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .app-title-ar {
            font-size: 34px;
            font-weight: 700;
            background: linear-gradient(135deg, #1a472a, #3a9e5f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }
        
        .form-group {
            margin-bottom: 28px;
        }
        
        .label-en {
            display: block;
            font-size: 15px;
            color: #1a472a;
            margin-bottom: 6px;
            text-align: left;
            font-weight: 500;
            opacity: 0.9;
        }
        
        .label-ar {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: #0d2c1a;
            margin-bottom: 10px;
            text-align: right;
        }
        
        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d1e7dd;
            border-radius: 10px;
            font-size: 16px;
            text-align: left;
            direction: ltr;
            background-color: #f8fff8;
            transition: all 0.3s ease;
            color: #0d2c1a;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #2d7d46;
            box-shadow: 0 0 0 3px rgba(45, 125, 70, 0.2);
            background-color: white;
        }
        
        .checkin-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1a472a 0%, #2d7d46 50%, #3a9e5f 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(26, 71, 42, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .checkin-btn:hover {
            transform: translateY(-3px);

box-shadow: 0 8px 20px rgba(26, 71, 42, 0.4);
        }
        
        .checkin-btn:active {
            transform: translateY(0);
        }
        
        .btn-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        
        .btn-en {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .btn-ar {
            font-size: 18px;
            font-weight: 700;
        }
        
        /* تأثيرات إضافية */
        .app-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #0d2c1a, #1a472a, #2d7d46, #3a9e5f);
            border-radius: 18px;
            z-index: -1;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="app-title">Hather</div>
            <div class="app-title-ar">حاضر</div>
        </div>
        
        <div class="form-group">
            <span class="label-en">Enter university ID</span>
            <span class="label-ar">ادخل الرقم الطلابي</span>
           <input type="text" class="input-field" maxlength="9" inputmode="numeric" pattern="[0-9]*">
        </div>
        
        <button class="checkin-btn">
            <div class="btn-content">
                <span class="btn-en">Check in</span>
                <span class="btn-ar">اضغط هنا</span>
            </div>
        </button>
        
        <!-- تم إزالة قسم الـ footer بالكامل -->
    </div>
    <script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzf16SmnpGqyicHdSWZfQariIwJQGI1MvLpnmBxMW2guMwxSql3UULbA-ntiFpPOPw/exec";

document.querySelector(".checkin-btn").addEventListener("click", () => {
  const studentId = document.querySelector(".input-field").value.trim();

  const isValid = /^[0-9]{9}$/.test(studentId);

  if (!isValid) {
    alert("❌ فشل تسجيل الدخول\nالرقم الجامعي يجب أن يتكون من 9 أرقام");
    return;
  }

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify({ studentId }),
  })
  .then(() => {
    alert("✅ تم تسجيل الدخول بنجاح");
    document.querySelector(".input-field").value = "";
  })
  .catch(() => {
    alert("❌ حدث خطأ، حاول مرة أخرى");
  });
});
</script>
</body>
</html>
