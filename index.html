<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=1" />
</head>
<body>
  <div class="container">
    <div class="top">
      <div>
        <h1>Hather - نظام الحضور</h1>

      </div>
    </div>

    <div class="grid">
      <div class="card">

        <p class="small">تسجيل حضور بالكود أو QR</p>
        <div style="height:10px"></div>
        <button class="btn primary" onclick="location.href='student.html'">فتح</button>
      </div>

      <div class="card">
        <h2 style="margin:0 0 10px">لوحة عضو هيئة التدريس</h2>
        <p class="small">إدارة المحاضرات + توليد رموز + عرض الطلاب</p>
        <div style="height:10px"></div>
        <button class="btn primary" onclick="location.href='doctor.html'">فتح</button>
      </div>

      <div class="card">
        <h2 style="margin:0 0 10px">التقارير</h2>
        <p class="small">الطالب: تقريره — الدكتور: تقرير مقرر بالـ PIN</p>
        <div style="height:10px"></div>
        <button class="btn primary" onclick="location.href='reports.html'">فتح</button>
      </div>
    </div>
  </div>
