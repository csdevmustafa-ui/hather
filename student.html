<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student - Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo">🎓</div>
        <div>
          <h1 id="txTitle">قسم الطالب</h1>
          <p id="txHint">سجّل حضورك بإدخال الكود</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="location.href='index.html'">Home</button>
      </div>
    </div>

    <div class="hr"></div>

    <div class="card">
      <label id="txStudentId">رقم الطالب</label>
      <input class="input" id="studentId" placeholder="مثال: 44123">

      <div style="height:10px"></div>

      <label id="txLectureId">LectureID (اختياري)</label>
      <input class="input" id="lectureId" placeholder="مثال: L177...">

      <div style="height:10px"></div>

      <label id="txCode">الكود</label>
      <input class="input" id="code" placeholder="مثال: 123456">

      <div style="height:12px"></div>

      <div class="row">
        <button class="btn primary" onclick="checkin()" id="txCheckin">تسجيل حضور</button>
        <button class="btn" onclick="pasteQrJson()" id="txPasteQr">لصق QR JSON</button>
      </div>

      <div style="height:10px"></div>
      <p id="txQrHint">الصق نص QR (اختياري) لتعبئة LectureID والكود تلقائيًا</p>

      <div class="status" id="st"></div>
    </div>

    <div class="footer">Hather Attendance System © 2026</div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    applyDocumentLang();

    document.title = t("studentTitle");
    $("txTitle").textContent = t("studentTitle");
    $("txStudentId").textContent = t("studentId");
    $("txLectureId").textContent = t("lectureIdOptional");
    $("txCode").textContent = t("code");
    $("txCheckin").textContent = t("checkin");
    $("txPasteQr").textContent = t("pasteQr");
    $("txQrHint").textContent = t("qrPasteHint");

    function show(type, msg){
      const el = $("st");
      el.className = "status show " + (type||"");
      el.textContent = msg || "";
    }

    async function pasteQrJson(){
      try{
        const text = await navigator.clipboard.readText();
        if(!text) { show("bad", "Clipboard empty"); return; }
        // try parse JSON
        let obj = null;
        try { obj = JSON.parse(text); } catch(e){}
        if(obj && obj.lectureId) $("lectureId").value = obj.lectureId;
        if(obj && obj.code) $("code").value = obj.code;
        if(!obj) show("warn", "Pasted (not JSON).");
        else show("ok", "OK ✅");
      }catch(e){
        show("bad", "Clipboard not allowed");
      }
    }

    async function checkin(){
      const studentId = ($("studentId").value||"").trim();
      const lectureId = ($("lectureId").value||"").trim();
      const code = ($("code").value||"").trim();

      if(!studentId || !code){
        show("bad", t("invalid"));
        return;
      }

      show("warn", t("loading"));
      let res;
      try{
        res = await apiCall({ action:"studentCheckin", studentId, lectureId, code });
      }catch(e){
        show("bad", t("failApi"));
        return;
      }

      if(res && res.ok){
        show("ok", t("success"));
      }else{
        show("bad", (res && res.error) ? res.error : "Failed");
      }
    }
  </script>
</body>
</html>
