<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>قسم الطالب - Hather</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=1" />
</head>
<body>
<div class="container">
  <div class="top">
    <div>
      <h1>قسم الطالب — تسجيل الحضور</h1>
      <p>اكتب StudentID ثم سجّل بالكود أو امسح QR</p>
    </div>
    <button class="btn" onclick="location.href='index.html'">رجوع</button>
  </div>

  <div class="grid">
    <div class="card">
      <h3 style="margin:0 0 10px;font-weight:900">التسجيل بالكود</h3>

      <label>StudentID</label>
      <input id="studentId" class="input" placeholder="مثال: 202311644" inputmode="numeric" maxlength="12"/>

      <div style="height:10px"></div>

      <label>Code / QR Text</label>
      <input id="codeInput" class="input" placeholder="مثال: 123456 أو نص QR" />

      <div style="height:10px"></div>

      <button class="btn primary" onclick="checkin()">تسجيل الحضور</button>

      <div id="status1" class="status"></div>
      <div class="small">QR يحتوي JSON {lectureId, code} — النظام يتعامل معه تلقائيًا.</div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;font-weight:900">التسجيل بالباركود (QR)</h3>

      <div id="qrReader" class="card" style="margin:0; min-height:280px; display:grid; place-items:center">
        <div class="small">اضغط تشغيل الكاميرا</div>
      </div>

      <div style="height:10px"></div>

      <button class="btn primary" onclick="startScan()">تشغيل الكاميرا</button>
      <button class="btn" onclick="stopScan()">إيقاف</button>

      <div id="status2" class="status"></div>
      <div class="small">اسمح للمتصفح باستخدام الكاميرا.</div>
    </div>
  </div>
</div>

<script src="assets/app.js?v=1"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
let qr = null;

async function checkin(codeOverride){
  const sid = ($("studentId").value||"").trim();
  const raw = (codeOverride!=null ? codeOverride : $("codeInput").value||"");
  const parsed = parseQRorCode(raw);

  if(!sid){ showStatus($("status1"),"bad","❌ أدخل StudentID"); return; }
  if(!parsed.code){ showStatus($("status1"),"bad","❌ أدخل الكود"); return; }

  showStatus($("status1"),"warn","⏳ جاري تسجيل الحضور...");
  const res = await apiCall({
    action:"studentCheckin",
    studentId:sid,
    code: parsed.code,
    lectureId: parsed.lectureId
  });

  if(res && res.ok){
    showStatus($("status1"),"ok",`✅ تم تسجيل حضورك — LectureID: ${res.lectureId||parsed.lectureId||""}`);
    $("codeInput").value = "";
  }else{
    showStatus($("status1"),"bad","❌ " + ((res && res.error) || "Failed"));
  }
}

async function startScan(){
  const sid = ($("studentId").value||"").trim();
  if(!sid){ showStatus($("status2"),"bad","❌ أدخل StudentID أولاً"); return; }

  if(!qr) qr = new Html5Qrcode("qrReader");
  showStatus($("status2"),"warn","⏳ تشغيل الكاميرا...");

  try{
    await qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      async (decodedText) => {
        showStatus($("status2"),"ok","✅ تم قراءة QR — جاري التسجيل...");
        await checkin(decodedText);
        await stopScan();
      }
    );
    showStatus($("status2"),"ok","📷 الكاميرا تعمل — وجّهها على QR");
  }catch(e){
    showStatus($("status2"),"bad","❌ فشل تشغيل الكاميرا — تأكد من السماح");
  }
}

async function stopScan(){
  if(qr){
    try{ await qr.stop(); await qr.clear(); }catch(e){}
  }
  showStatus($("status2"),"", "—");
}
</script>
</body>
</html>
