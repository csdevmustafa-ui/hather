<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hather - Student</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{
    min-height:100vh;
    background: linear-gradient(135deg,#0d2c1a 0%, #1a472a 45%, #2d7d46 100%);
    display:flex;align-items:center;justify-content:center;
    padding:20px;color:#fff;
  }
  .card{
    width:100%;max-width:420px;border-radius:18px;padding:22px;
    background: rgba(13, 44, 26, 0.78);
    box-shadow: 0 18px 45px rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .icon-btn{
    width:42px;height:42px;border-radius:12px;border:none;cursor:pointer;
    background: rgba(255,255,255,.12);color:#fff;font-size:18px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
  }
  .back{color:#d6ffe9;text-decoration:none;font-weight:900;opacity:.9}
  .header{text-align:center;padding-bottom:14px;margin-bottom:16px;position:relative}
  .header::after{
    content:'';position:absolute;bottom:0;left:15%;right:15%;height:2px;
    background: linear-gradient(to right, transparent, rgba(76,201,135,.95), transparent);
  }
  .title{
    font-size:42px;font-weight:900;
    background: linear-gradient(135deg, #b9ffd9, #4cc987);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{margin-top:6px;font-size:16px;font-weight:900;color:#d6ffe9;opacity:.95}
  label{display:block;margin:14px 0 6px;font-weight:900;color: rgba(255,255,255,.92)}
  .hint{font-size:13px;font-weight:700;color: rgba(255,255,255,.72);margin-top:2px}
  input{
    width:100%;padding:14px;border-radius:12px;border:2px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.92);font-size:17px;color:#0d2c1a;direction:ltr;
  }
  input:focus{outline:none;border-color:#4cc987;box-shadow:0 0 0 3px rgba(76,201,135,.20)}
  button.primary{
    width:100%;margin-top:16px;padding:16px 14px;border:none;border-radius:14px;cursor:pointer;
    color:#fff;font-weight:900;font-size:18px;
    background: linear-gradient(135deg,#1a472a,#2d7d46,#4cc987);
    box-shadow: 0 10px 22px rgba(0,0,0,.22);
  }
  button.primary:disabled{opacity:.65;cursor:not-allowed}
  #spinner{
    width:26px;height:26px;border:4px solid rgba(255,255,255,.25);border-top:4px solid #4cc987;
    border-radius:50%;animation:spin 1s linear infinite;margin:14px auto 0;display:none;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #msg{min-height:22px;margin-top:12px;text-align:center;font-weight:900}
  .links{margin-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .links a{color:#d6ffe9;text-decoration:none;font-weight:800;opacity:.92}
</style>
</head>

<body>
  <div class="card">
    <div class="topbar">
      <a class="back" href="index.html" id="backHome">↩ الرئيسية</a>
      <button class="icon-btn" id="langBtn" title="Language">🌐</button>
    </div>

    <div class="header">
      <div class="title">Hather</div>
      <div class="subtitle" id="subTitle">قسم الطالب - تسجيل الحضور</div>
    </div>

    <label id="lblId">الرقم الجامعي</label>
    <div class="hint" id="hintId">يجب أن يكون 9 أرقام</div>
    <input id="studentId" maxlength="9" inputmode="numeric" placeholder="441234567" />

    <label id="lblCode">كود المحاضرة</label>
    <div class="hint" id="hintCode">يجب أن يكون 6 أرقام (يعطيه الدكتور)</div>
    <input id="lectureCode" maxlength="6" inputmode="numeric" placeholder="123456" />

    <button class="primary" id="btn">تسجيل</button>
    <div id="spinner"></div>
    <div id="msg"></div>

    <div class="links">
      <a href="reports.html" id="goReports">تقارير الطالب</a>
      <a href="doctor.html" id="goDoctor">قسم الدكتور</a>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjIB2ICWitmLIvaHb7eIUhiGPZhKWES6vnsNZUrpQR45pNQh-ZMzMLMy3mid3kFx0/exec";

  const STR = {
    ar:{
      dir:"rtl", lang:"ar",
      backHome:"↩ الرئيسية",
      subTitle:"قسم الطالب - تسجيل الحضور",
      lblId:"الرقم الجامعي", hintId:"يجب أن يكون 9 أرقام",
      lblCode:"كود المحاضرة", hintCode:"يجب أن يكون 6 أرقام (يعطيه الدكتور)",
      btn:"تسجيل",
      goReports:"تقارير الطالب",
      goDoctor:"قسم الدكتور",
      invalid_id:"❌ الرقم الجامعي لازم 9 أرقام",
      invalid_code:"❌ كود المحاضرة لازم 6 أرقام",
      wait:"⏳ جاري تسجيل الحضور...",
      fail:"❌ فشل الاتصال"
    },
    en:{
      dir:"ltr", lang:"en",
      backHome:"↩ Home",
      subTitle:"Student - Check-in",
      lblId:"University ID", hintId:"Must be 9 digits",
      lblCode:"Lecture code", hintCode:"Must be 6 digits (from doctor)",
      btn:"Check in",
      goReports:"Student Reports",
      goDoctor:"Doctor",
      invalid_id:"❌ University ID must be 9 digits",
      invalid_code:"❌ Lecture code must be 6 digits",
      wait:"⏳ Checking in...",
      fail:"❌ Connection failed"
    }
  };

  function getLang(){ return localStorage.getItem("hather_lang") || "ar"; }
  function setLang(l){ localStorage.setItem("hather_lang", l); }
  function applyLang(){
    const t = STR[getLang()];
    document.documentElement.lang = t.lang;
    document.documentElement.dir = t.dir;
    backHome.textContent = t.backHome;
    subTitle.textContent = t.subTitle;
    lblId.textContent = t.lblId;
    hintId.textContent = t.hintId;
    lblCode.textContent = t.lblCode;
    hintCode.textContent = t.hintCode;
    btn.textContent = t.btn;
    goReports.textContent = t.goReports;
    goDoctor.textContent = t.goDoctor;
  }
  langBtn.addEventListener("click", ()=>{
    setLang(getLang()==="ar" ? "en" : "ar");
    applyLang();
  });
  applyLang();

  const btnEl = document.getElementById("btn");
  const spinner = document.getElementById("spinner");
  const msg = document.getElementById("msg");

  btnEl.addEventListener("click", ()=>{
    const t = STR[getLang()];
    const studentId = document.getElementById("studentId").value.trim();
    const lectureCode = document.getElementById("lectureCode").value.trim();

    if(!/^\d{9}$/.test(studentId)){
      msg.style.color="salmon"; msg.textContent=t.invalid_id; return;
    }
    if(!/^\d{6}$/.test(lectureCode)){
      msg.style.color="salmon"; msg.textContent=t.invalid_code; return;
    }

    btnEl.disabled = true;
    spinner.style.display = "block";
    msg.style.color = "#d6ffe9";
    msg.textContent = t.wait;

    fetch(SCRIPT_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ studentId, lectureCode })
    })
    .then(r=>r.json())
    .then(d=>{
      msg.style.color = d.ok ? "#7CFFB2" : "salmon";
      msg.textContent = d.result || (d.ok ? "OK" : "Error");
    })
    .catch(()=>{
      msg.style.color="salmon"; msg.textContent=t.fail;
    })
    .finally(()=>{
      spinner.style.display="none";
      btnEl.disabled=false;
    });
  });
</script>
</body>
</html>
