<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student - Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-left">
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer" title="Home">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="rgba(255,255,255,.9)" stroke-width="1.8"/>
          </svg>
        </div>
        <div class="brand-titles">
          <h1 data-i18n="studentTitle">قسم الطالب</h1>
          <p data-i18n="studentSub">ادخل بياناتك لتسجيل الحضور</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="lang-chip" onclick="toggleLang()"><span>AR/EN</span></div>
      </div>
    </div>

    <div class="grid-center">
      <div class="card">
        <div class="form">
          <div>
            <label data-i18n="studentId">الرقم الجامعي (9 أرقام)</label>
            <input id="studentId" class="input" inputmode="numeric" maxlength="9" data-i18n-placeholder="studentId" placeholder="الرقم الجامعي (9 أرقام)">
          </div>

          <div>
            <label data-i18n="lectureId">LectureID</label>
            <input id="lectureId" class="input" placeholder="مثال: L1770...">
            <div class="small">يمكن إدخال LectureID أو استخدام الكود</div>
          </div>

          <div>
            <label data-i18n="code">كود المحاضرة (اختياري)</label>
            <input id="lectureCode" class="input" inputmode="numeric" maxlength="6" placeholder="مثال: 123456">
          </div>

          <button id="btn" class="btn primary" onclick="submitAttendance()">
            <div class="left">
              <div class="spinner" id="sp"></div>
            </div>
            <div class="text" style="text-align:right">
              <span data-i18n="submit">تسجيل الحضور</span>
              <span class="sub" id="subText">—</span>
            </div>
          </button>

          <div class="status" id="status"></div>
        </div>
      </div>
    </div>
  </div>

<script src="assets/app.js"></script>
<script>
applyLang();

async function submitAttendance(){
  const status = document.getElementById("status");
  const btn = document.getElementById("btn");
  const sp = document.getElementById("sp");
  const subText = document.getElementById("subText");

  const studentId = (document.getElementById("studentId").value || "").trim();
  const lectureId  = (document.getElementById("lectureId").value || "").trim();
  const code       = (document.getElementById("lectureCode").value || "").trim();

  if(!/^[0-9]{9}$/.test(studentId)){
    showStatus(status, "danger", t("badId"));
    return;
  }
  if(!lectureId && !code){
    showStatus(status, "danger", t("needLectureOrCode"));
    return;
  }

  subText.textContent = t("loading");
  setLoading(btn, sp, true);
  showStatus(status, "warn", t("loading"));

  const payload = {
    action: "studentCheckin",
    studentId,
    lectureId,
    code
  };

  const res = await apiCall(payload);
  if(res && res.ok){
    showStatus(status, "success", t("ok"));
  } else {
    showStatus(status, "danger", (res && res.error) ? res.error : t("failed"));
  }

  setLoading(btn, sp, false);
  subText.textContent = "—";
}
</script>
</body>
</html>
