<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student - Hather</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#083d25;
  --bg2:#0f6b42;
  --card:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.16);
  --text:rgba(255,255,255,.95);
  --muted:rgba(255,255,255,.90);
  --input:rgba(255,255,255,.12);
  --btn1:#19c37d;
  --btn2:#0f9d62;
  --shadow:0 18px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{
  margin:0; min-height:100vh;
  background:
    radial-gradient(1200px 700px at 40% -10%, rgba(255,255,255,.08), transparent 60%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
}
.container{width:min(980px,92vw);margin:26px auto}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.brand h1{margin:0;font-size:22px;font-weight:900}
.brand p{margin:6px 0 0;color:#fff;opacity:.95;font-size:13px}
.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:22px; box-shadow:var(--shadow);
  backdrop-filter: blur(12px);
  padding:18px;
}
.hr{height:1px;background:var(--line);margin:14px 0}
label{display:block;font-size:12px;color:#fff;opacity:.95;margin-bottom:6px}
.input{
  width:100%; padding:12px 14px; border-radius:16px;
  border:1px solid rgba(255,255,255,.22);
  background:var(--input); color:#fff; outline:none;
}
.input::placeholder{color:rgba(255,255,255,.85)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:10px;border:none;border-radius:16px;
  padding:12px 14px;cursor:pointer;color:#fff;font-weight:900;
  background:rgba(255,255,255,.14);
}
.btn.primary{background:linear-gradient(135deg,var(--btn1),var(--btn2))}
.status{margin-top:10px;font-weight:900;color:#fff}
.grid{display:grid;grid-template-columns: 1fr 1fr;gap:12px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.qrbox{
  border-radius:18px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.18);
  padding:12px;
}
#qrReader{width:100%}
.small{color:#fff;opacity:.95;font-size:12px}
</style>
</head>

<body>
<div class="container">
  <div class="brand">
    <div>
      <h1>قسم الطالب</h1>
      <p>سجّل حضورك بالكود أو بمسح QR — بدون الحاجة لـ LectureID</p>
    </div>
    <div class="actions" style="margin:0">
      <button class="btn" onclick="openApiSetup()">⚙️ إعداد الربط</button>
      <button class="btn" onclick="location.href='index.html'">الصفحة الرئيسية</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3 style="margin:0 0 10px;">بيانات الطالب</h3>
      <label>StudentID</label>
      <input id="studentId" class="input" placeholder="مثال: 441234567" />

      <div class="hr"></div>

      <h3 style="margin:0 0 10px;">إدخال كود الحضور</h3>
      <label>Code</label>
      <input id="codeInput" class="input" placeholder="مثال: 123456" inputmode="numeric" maxlength="6" />

      <div class="actions">
        <button class="btn primary" onclick="submitCode()">تسجيل الحضور</button>
      </div>

      <div class="status" id="studentStatus"></div>
      <div class="small">إذا انتهت صلاحية الكود اطلب من الدكتور توليد كود جديد.</div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;">التسجيل بالباركود (QR)</h3>
      <div class="qrbox">
        <div id="qrReader"></div>
      </div>

      <div class="actions">
        <button class="btn primary" onclick="startScan()">تشغيل الكاميرا</button>
        <button class="btn" onclick="stopScan()">إيقاف</button>
      </div>
      <div class="status" id="qrStatus"></div>
      <div class="small">وجّه الكاميرا على QR، وسيتم تسجيل الحضور تلقائيًا.</div>
    </div>
  </div>
</div>

<!-- QR library -->
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="assets/app.js"></script>

<script>
let qr = null;

function setStatus(id, msg){
  document.getElementById(id).textContent = msg || "";
}

async function submitCode(codeOverride){
  const studentId = (document.getElementById("studentId").value||"").trim();
  const code = (codeOverride || document.getElementById("codeInput").value || "").trim();
  if(!studentId){ setStatus("studentStatus","❌ أدخل StudentID"); return; }
  if(!code){ setStatus("studentStatus","❌ أدخل الكود"); return; }

  setStatus("studentStatus","⏳ جاري تسجيل الحضور...");
  const res = await apiCall({ action:"studentCheckIn", studentId, code });

  if(res && res.ok){
    const lec = res.lecture || {};
    setStatus("studentStatus", `✅ تم تسجيل حضورك — ${lec.course||""} (شعبة ${lec.section||""})`);
  }else{
    setStatus("studentStatus", "❌ " + ((res&&res.error)||"Failed"));
  }
}

async function startScan(){
  const studentId = (document.getElementById("studentId").value||"").trim();
  if(!studentId){ setStatus("qrStatus","❌ أدخل StudentID أولًا"); return; }

  if(!qr){
    qr = new Html5Qrcode("qrReader");
  }

  setStatus("qrStatus","⏳ تشغيل الكاميرا...");
  const config = { fps: 10, qrbox: { width: 240, height: 240 } };

  try{
    await qr.start(
      { facingMode: "environment" },
      config,
      async (decodedText) => {
        // decodedText is code
        setStatus("qrStatus","✅ تم التقاط الكود... جاري التسجيل");
        await submitCode(decodedText.trim());
        // stop after success to avoid repeats
        await stopScan();
      }
    );
    setStatus("qrStatus","📷 الكاميرا تعمل — وجّهها على QR");
  }catch(e){
    setStatus("qrStatus","❌ فشل تشغيل الكاميرا (تأكد من السماح للمتصفح)");
  }
}

async function stopScan(){
  if(qr){
    try{
      await qr.stop();
      await qr.clear();
    }catch(e){}
  }
  setStatus("qrStatus","—");
}
</script>
</body>
</html>
