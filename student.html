<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>قسم الطالب - Hather</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#062716; --bg2:#0a3a22; --bg3:#0f5a34;
  --card:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.14);
  --text:rgba(255,255,255,.94);
  --muted:rgba(255,255,255,.78);
  --accent:#18c26b; --accent2:#11a85b;
  --shadow:0 18px 60px rgba(0,0,0,.35);
  --radius:22px;
}
*{box-sizing:border-box;font-family:"Cairo",sans-serif}
body{
  margin:0; min-height:100vh; color:var(--text);
  background:
    radial-gradient(1200px 600px at 50% 0%, rgba(255,255,255,.08), transparent 60%),
    radial-gradient(900px 420px at 0% 100%, rgba(24,194,107,.20), transparent 60%),
    linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
  padding:18px;
}
.container{width:min(980px,94vw);margin:22px auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
h1{margin:0;font-size:20px;font-weight:900}
p{margin:6px 0 0;color:var(--muted);font-size:13px}
.btn{
  border:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.08);
  color:var(--text);
  padding:10px 12px;
  border-radius:16px;
  cursor:pointer;
  transition:.15s ease;
}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.10)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06210f;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  backdrop-filter: blur(12px);
}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.input{
  width:100%;padding:12px 12px;border-radius:16px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.14);color:var(--text);outline:none;
}
.input::placeholder{color:rgba(255,255,255,.55)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.status{
  margin-top:10px;padding:10px 12px;border-radius:14px;
  border:1px solid rgba(255,255,255,.14);
  background: rgba(0,0,0,.14);
  display:none;font-size:13px;font-weight:900;color:#fff;
}
.status.show{display:block}
.status.ok{border-color: rgba(82,255,162,.35); background: rgba(82,255,162,.12);}
.status.bad{border-color: rgba(255,93,93,.35); background: rgba(255,93,93,.12);}
.status.warn{border-color: rgba(255,204,102,.35); background: rgba(255,204,102,.10);}
.qrbox{
  background: rgba(0,0,0,.14);
  border:1px dashed rgba(255,255,255,.18);
  border-radius: 18px;
  padding:12px;
}
.small{color:#fff;opacity:.92;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div>
      <h1>قسم الطالب — تسجيل الحضور</h1>
      <p>اكتب StudentID ثم سجّل بالكود أو امسح QR</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="location.href='index.html'">رجوع</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3 style="margin:0 0 10px;font-weight:900">التسجيل بالكود</h3>

      <label>StudentID</label>
      <input id="studentId" class="input" placeholder="مثال: 441234567" inputmode="numeric" maxlength="9"/>

      <div style="height:10px"></div>

      <label>Code</label>
      <input id="codeInput" class="input" placeholder="مثال: 123456" inputmode="numeric" maxlength="12"/>

      <div class="actions">
        <button class="btn primary" onclick="checkinByCode()">تسجيل الحضور</button>
      </div>

      <div id="status1" class="status"></div>
      <div class="small">إذا الكود من QR قد يكون نص JSON — النظام يتعامل معه تلقائيًا.</div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;font-weight:900">التسجيل بالباركود (QR)</h3>
      <div class="qrbox">
        <div id="qrReader"></div>
      </div>

      <div class="actions">
        <button class="btn primary" onclick="startScan()">تشغيل الكاميرا</button>
        <button class="btn" onclick="stopScan()">إيقاف</button>
      </div>

      <div id="status2" class="status"></div>
      <div class="small">اسمح للمتصفح باستخدام الكاميرا.</div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let qr = null;
const $ = (id)=>document.getElementById(id);

function showStatus(el, type, msg){
  el.className = "status show " + (type||"");
  el.textContent = msg || "";
}

function parseQRorCode(txt){
  const t = (txt||"").trim();
  if(!t) return { code:"", lectureId:"" };
  // QR in our system could be JSON {lectureId, code}
  try{
    const obj = JSON.parse(t);
    if(obj && obj.code){
      return { code: String(obj.code||"").trim(), lectureId: String(obj.lectureId||"").trim() };
    }
  }catch(e){}
  // otherwise it is a raw code
  return { code: t, lectureId:"" };
}

async function checkinByCode(codeOverride){
  const sid = ($("studentId").value||"").trim();
  const raw = (codeOverride!=null ? codeOverride : $("codeInput").value);
  const parsed = parseQRorCode(raw);

  if(!sid){ showStatus($("status1"),"bad","❌ أدخل StudentID"); return; }
  if(!parsed.code){ showStatus($("status1"),"bad","❌ أدخل الكود"); return; }

  showStatus($("status1"),"warn","⏳ جاري تسجيل الحضور...");
  const res = await apiCall({ action:"studentCheckin", studentId: sid, code: parsed.code, lectureId: parsed.lectureId });

  if(res && res.ok){
    showStatus($("status1"),"ok",`✅ تم تسجيل حضورك — LectureID: ${res.lectureId||""}`);
    $("codeInput").value = "";
  }else{
    showStatus($("status1"),"bad","❌ " + ((res && res.error) || "Failed"));
  }
}

async function startScan(){
  const sid = ($("studentId").value||"").trim();
  if(!sid){ showStatus($("status2"),"bad","❌ أدخل StudentID أولاً"); return; }

  if(!qr) qr = new Html5Qrcode("qrReader");
  showStatus($("status2"),"warn","⏳ تشغيل الكاميرا...");

  try{
    await qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      async (decodedText) => {
        showStatus($("status2"),"ok","✅ تم قراءة QR — جاري التسجيل...");
        await checkinByCode(decodedText);
        await stopScan();
      }
    );
    showStatus($("status2"),"ok","📷 الكاميرا تعمل — وجّهها على QR");
  }catch(e){
    showStatus($("status2"),"bad","❌ فشل تشغيل الكاميرا — تأكد من السماح");
  }
}

async function stopScan(){
  if(qr){
    try{ await qr.stop(); await qr.clear(); }catch(e){}
  }
  showStatus($("status2"),"", "—");
}
</script>
</body>
</html>
