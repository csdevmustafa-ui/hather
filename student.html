<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hather - حاضر</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{
      min-height:100vh;
      background: linear-gradient(135deg, #0b2416 0%, #174c30 50%, #2f8f55 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:420px;
      background: rgba(244, 251, 247, 0.96);
      border-radius:18px;
      box-shadow:0 18px 40px rgba(0,0,0,.35);
      padding:26px;
      position:relative;
      border:1px solid rgba(255,255,255,.35);
      backdrop-filter: blur(6px);
    }

    .container::before{
      content:'';
      position:absolute;
      top:-2px;left:-2px;right:-2px;bottom:-2px;
      background: linear-gradient(135deg, #0e3b24, #1f6b43, #3aa76a);
      border-radius:20px;
      z-index:-1;
      opacity:.35;
    }

    .header{
      text-align:center;
      padding-bottom:16px;
      margin-bottom:18px;
      position:relative;
    }
    .header::after{
      content:'';
      position:absolute;
      bottom:0;
      left:15%;
      right:15%;
      height:2px;
      background: linear-gradient(to right, transparent, #2f8f55, transparent);
    }

    .title{
      font-size:42px;
      font-weight:900;
      background: linear-gradient(135deg, #0e3b24, #2f8f55);
      -webkit-background-clip:text;
      color:transparent;
      line-height:1;
    }
    .subtitle{
      margin-top:8px;
      font-size:18px;
      font-weight:800;
      color:#1f6b43;
    }
    .hint{
      margin-top:10px;
      font-size:14px;
      color:#2b5e42;
      opacity:.9;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:18px;
    }

    .btn{
      width:100%;
      padding:16px 14px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      color:#fff;
      font-size:18px;
      font-weight:900;
      letter-spacing:.3px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-shadow:0 10px 20px rgba(27,94,59,.22);
    }
    .btn small{
      font-size:13px;
      font-weight:700;
      opacity:.9;
    }

    .btn.student{
      background: linear-gradient(135deg, #1b5e3b, #2f8f55, #4cc987);
    }
    .btn.report{
      background: linear-gradient(135deg, #0e3b24, #1f6b43);
    }
    .btn.doctor{
      background: linear-gradient(135deg, #244b3a, #0e3b24);
    }

    .footer{
      margin-top:16px;
      text-align:center;
      font-size:12px;
      color:#2b5e42;
      opacity:.85;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="title">Hather</div>
      <div class="subtitle">حاضر</div>
      <div class="hint">اختر القسم المناسب للمتابعة</div>
    </div>

    <div class="menu">
      <button class="btn student" onclick="location.href='student.html'">
        <span>قسم الطالب <small>تسجيل الحضور</small></span>
        <span>➜</span>
      </button>

      <button class="btn report" onclick="location.href='reports.html'">
        <span>تقارير الطالب <small>نسبة الحضور والتأخير</small></span>
        <span>➜</span>
      </button>

      <button class="btn doctor" onclick="location.href='doctor.html'">
        <span>قسم الدكتور <small>إدارة المحاضرات والتقارير</small></span>
        <span>➜</span>
      </button>
    </div>

    <div class="footer">Hather • نظام حضور بسيط وعملي</div>
  </div>
</body>
</html>
