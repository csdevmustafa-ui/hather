<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student - Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=1">
  <script src="assets/app.js?v=1"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<div class="container">
  <div class="glass topbar">
    <div class="brand">
      <div class="logo">🎓</div>
      <div class="brandTitle">
        <h1 data-i18n="student">الطالب</h1>
        <p data-i18n="app_name">Hather</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn" href="index.html"><span data-i18n="back_home">الرئيسية</span></a>
      <a class="btn" href="student-report.html"><span data-i18n="student_report">تقرير الطالب</span></a>
    </div>
  </div>

  <div class="glass card" style="margin-top:16px;">
    <h2 data-i18n="checkin">تسجيل حضور</h2>

    <div class="row">
      <div>
        <label data-i18n="student_id">الرقم الجامعي</label>
        <input class="input" id="studentId" data-i18n-ph="student_id" placeholder="Student ID" />
      </div>
      <div>
        <label data-i18n="lecture_id_optional">LectureID (اختياري)</label>
        <input class="input" id="lectureId" data-i18n-ph="lecture_id_optional" placeholder="LectureID (optional)" />
      </div>
    </div>

    <div style="height:10px"></div>

    <label data-i18n="code">الرمز</label>
    <input class="input" id="code" data-i18n-ph="code" placeholder="Code" />

    <div style="height:12px"></div>

    <div class="row">
      <button class="btn primary" onclick="checkin()"><span data-i18n="checkin">تسجيل حضور</span></button>
      <button class="btn" id="camBtn" onclick="toggleCam()"><span data-i18n="open_camera">فتح الكاميرا</span></button>
    </div>

    <div class="status" id="st"></div>

    <div class="hr"></div>

    <h2 data-i18n="camera">الكاميرا</h2>
    <div class="glass card" style="margin:0; padding:12px;">
      <div id="qrReader" style="width:100%; max-width:520px; margin:auto;"></div>
    </div>
  </div>

  <div class="footer">Hather Attendance System © 2026</div>
</div>

<script>
  HATHER.applyI18n();
  const $ = HATHER.qs;
  const st = $("st");

  function show(type,msg){ st.className="status show "+(type||""); st.textContent=msg||""; }
  function hide(){ st.className="status"; st.textContent=""; }

  async function checkin(){
    hide();
    const studentId = ($("studentId").value||"").trim();
    const lectureId = ($("lectureId").value||"").trim();
    const code = ($("code").value||"").trim();

    if(!studentId){ show("bad","Student ID"); return; }
    if(!code){ show("bad","Code"); return; }

    try{
      const payload = { action:"studentCheckin", studentId, code };
      if(lectureId) payload.lectureId = lectureId;
      const res = await HATHER.apiPost(payload);
      if(res && res.ok){
        show("ok","OK");
      }else{
        show("bad", (res && res.error) ? res.error : "Failed");
      }
    }catch(e){
      show("bad", HATHER.t("api_error"));
    }
  }

  let scanner = null;
  let camOn = false;

  function fillFromQr(text){
    try{
      const obj = JSON.parse(text);
      if(obj && obj.code) $("code").value = String(obj.code);
      if(obj && obj.lectureId) $("lectureId").value = String(obj.lectureId);
      show("ok","OK");
    }catch(e){
      $("code").value = text;
      show("warn","OK");
    }
  }

  async function toggleCam(){
    const btn = $("camBtn");
    if(camOn){
      await stopCam();
      camOn = false;
      btn.textContent = HATHER.t("open_camera");
      return;
    }
    await startCam();
    camOn = true;
    btn.textContent = HATHER.t("stop_camera");
  }

  async function startCam(){
    hide();
    if(!scanner) scanner = new Html5Qrcode("qrReader");

    try{
      const cams = await Html5Qrcode.getCameras();
      if(!cams || cams.length === 0){
        show("bad","No Camera");
        return;
      }
      const camId = cams[cams.length-1].id;
      await scanner.start(
        camId,
        { fps: 10, qrbox: { width: 260, height: 260 } },
        (decodedText) => {
          fillFromQr(decodedText);
          stopCam();
          camOn = false;
          $("camBtn").textContent = HATHER.t("open_camera");
        }
      );
      show("warn","...");
    }catch(e){
      show("bad","Camera permission");
    }
  }

  async function stopCam(){
    try{
      if(scanner && scanner.isScanning){
        await scanner.stop();
        await scanner.clear();
      }
    }catch(e){}
  }
</script>

</body>
</html>
