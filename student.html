<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student - Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=3">
  <script src="assets/app.js?v=3"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<div class="container">

  <div class="glass topbar">
    <div class="brand">
      <div class="logo">🎓</div>
      <div class="brandTitle">
        <h1 data-i18n="student">واجهة الطالب</h1>
        <p>تسجيل حضور يدوي أو بالكاميرا (QR)</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn" href="index.html"><span data-i18n="back_home">الرئيسية</span></a>
      <a class="btn" href="student-report.html"><span data-i18n="student_report">تقرير الطالب</span></a>
    </div>
  </div>

  <div class="glass card" style="margin-top:16px;">
    <h2>تسجيل الحضور</h2>

    <div class="row">
      <div>
        <label data-i18n="student_id">رقم الطالب</label>
        <input class="input" id="studentId" data-i18n-ph="student_id" placeholder="Student ID" />
      </div>
      <div>
        <label data-i18n="lecture_id">LectureID (اختياري)</label>
        <input class="input" id="lectureId" data-i18n-ph="lecture_id" placeholder="LectureID (optional)" />
      </div>
    </div>

    <div style="height:10px"></div>

    <label data-i18n="code">الكود</label>
    <input class="input" id="code" data-i18n-ph="code" placeholder="Code" />

    <div style="height:12px"></div>

    <div class="row">
      <button class="btn primary" onclick="checkin()" data-i18n="checkin">تسجيل حضور</button>
      <button class="btn" id="camBtn" onclick="toggleCam()" data-i18n="scan">فتح الكاميرا</button>
    </div>

    <div class="status" id="st"></div>

    <div class="hr"></div>

    <h2>الكاميرا</h2>
    <div class="glass card" style="margin:0; padding:12px;">
      <div id="qrReader" style="width:100%; max-width:520px; margin:auto;"></div>
      <p style="margin:10px 0 0;color:rgba(255,255,255,.7);font-size:12px;text-align:center;">
        QR يحتوي JSON مثل: {"lectureId":"...","code":"..."}
      </p>
    </div>
  </div>

  <div class="footer">Hather Attendance System © 2026</div>
</div>

<script>
  HATHER.applyI18n();

  const $ = HATHER.qs;
  const st = $("st");

  function show(type,msg){ st.className="status show "+(type||""); st.textContent=msg||""; }
  function hide(){ st.className="status"; st.textContent=""; }

  async function checkin(){
    hide();
    const studentId = ($("studentId").value||"").trim();
    const lectureId = ($("lectureId").value||"").trim();
    const code = ($("code").value||"").trim();

    if(!studentId){ show("bad","اكتب رقم الطالب"); return; }
    if(!code){ show("bad","اكتب الكود"); return; }

    try{
      const payload = { action:"studentCheckin", studentId, code };
      if(lectureId) payload.lectureId = lectureId;
      const res = await HATHER.apiPost(payload);
      if(res && res.ok){
        show("ok","تم تسجيل الحضور ✅");
      }else{
        show("bad", (res && res.error) ? res.error : "Failed");
      }
    }catch(e){
      show("bad", HATHER.t("error_api"));
    }
  }

  // -------- Camera QR --------
  let scanner = null;
  let camOn = false;

  function parseQr(text){
    // expected: JSON {lectureId, code}
    try{
      const obj = JSON.parse(text);
      if(obj && obj.code){
        $("code").value = String(obj.code||"");
      }
      if(obj && obj.lectureId){
        $("lectureId").value = String(obj.lectureId||"");
      }
      show("ok","تم قراءة QR ✅");
    }catch(e){
      // if plain code
      $("code").value = text;
      show("warn","تم قراءة نص QR (غير JSON)");
    }
  }

  async function toggleCam(){
    const btn = $("camBtn");
    if(camOn){
      await stopCam();
      camOn = false;
      btn.textContent = HATHER.t("scan");
      return;
    }
    await startCam();
    camOn = true;
    btn.textContent = HATHER.t("stop_scan");
  }

  async function startCam(){
    hide();
    if(!scanner) scanner = new Html5Qrcode("qrReader");
    try{
      const cameras = await Html5Qrcode.getCameras();
      if(!cameras || cameras.length === 0){
        show("bad","لا يوجد كاميرا");
        return;
      }
      const camId = cameras[cameras.length-1].id; // الخلفية غالبًا
      await scanner.start(
        camId,
        { fps: 10, qrbox: { width: 260, height: 260 } },
        (decodedText) => {
          parseQr(decodedText);
          // auto-stop after read
          stopCam();
          camOn = false;
          $("camBtn").textContent = HATHER.t("scan");
        }
      );
      show("warn","الكاميرا تعمل… وجّهها على QR");
    }catch(e){
      show("bad","فشل تشغيل الكاميرا (تحقق من صلاحيات المتصفح)");
    }
  }

  async function stopCam(){
    try{
      if(scanner && scanner.isScanning){
        await scanner.stop();
        await scanner.clear();
      }
    }catch(e){}
  }
</script>

</body>
</html>
