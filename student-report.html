<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Report - Hather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="top">
      <div>
        <h1>تقارير الطالب</h1>
        <p>عرض الحضور والغياب والتأخير</p>
      </div>
      <button class="btn" onclick="location.href='reports.html'">رجوع</button>
    </div>

    <div class="card">
      <div style="display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end">
        <div>
          <label>الرقم الجامعي</label>
          <input id="studentId" class="input" inputmode="numeric" maxlength="12" placeholder="مثال: 202311644">
        </div>
        <button class="btn primary" onclick="loadReport()">عرض التقرير</button>
      </div>

      <div id="status" class="status"></div>
      <div class="hr"></div>

      <div class="grid">
        <div class="card" style="margin:0">
          <h3 style="margin:0 0 10px">ملخص</h3>
          <div id="summary" class="small">—</div>
        </div>
        <div class="card" style="margin:0">
          <h3 style="margin:0 0 10px">الرسم</h3>
          <canvas id="chart" height="180"></canvas>
        </div>
      </div>

      <div class="hr"></div>

      <h3 style="margin:0 0 10px">تفاصيل آخر السجلات</h3>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>LectureID</th>
              <th>الوقت</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

<script src="assets/app.js?v=1"></script>
<script>
let chartInstance;

(function(){
  const p = new URLSearchParams(location.search);
  const sid = p.get("sid");
  if(sid) $("studentId").value = sid;
})();

async function loadReport(){
  const id = ($("studentId").value||"").trim();
  const status = $("status");

  if(!id){
    showStatus(status,"bad","أدخل الرقم الجامعي");
    return;
  }

  showStatus(status,"warn","جاري التحميل...");

  const res = await apiCall({action:"studentReport", studentId:id});

  if(!res || !res.ok){
    showStatus(status,"bad",(res&&res.error)?res.error:"فشل الطلب");
    return;
  }

  showStatus(status,"ok","تم تحميل التقرير ✅");

  const data = res.data || {};
  const present = data.present || 0;
  const absent  = data.absent || 0;
  const late    = data.late || 0;
  const total   = (present+absent+late) || 0;

  $("summary").innerHTML = `
    <div>إجمالي السجلات: <b>${total}</b></div>
    <div>حضور: <b>${present}</b></div>
    <div>تأخير: <b>${late}</b></div>
    <div>غياب: <b>${absent}</b></div>
  `;

  const ctx = $("chart");
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["حضور","تأخير","غياب"],
      datasets: [{ data: [present, late, absent] }]
    },
    options: { plugins: { legend: { position:"bottom" } }, cutout:"70%" }
  });

  const rows = data.rows || [];
  $("rows").innerHTML = rows.map(r=>`
    <tr>
      <td>${r.lectureId||""}</td>
      <td>${fmtTime(r.time||"")}</td>
      <td>${r.status||""}</td>
    </tr>
  `).join("");
}
</script>
</body>
</html>
