<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة التحكم – عضو هيئة التدريس</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f3d2e, #1e7f55);
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
    }

    header h1 {
      font-size: 22px;
      margin: 0;
    }

    .btn {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .container {
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 16px;
      color: #d1ffe9;
    }

    .card .value {
      font-size: 32px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      overflow: hidden;
    }

    th, td {
      padding: 14px;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: rgba(0,0,0,0.25);
      color: #c8ffe8;
    }

    tr:not(:last-child) {
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    footer {
      text-align: center;
      padding: 25px;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <!-- ===== Header ===== -->
  <header>
    <h1>لوحة التحكم – عضو هيئة التدريس</h1>

    <button class="btn" onclick="goToDoctor()">
      🔐 الانتقال إلى لوحة تحكم الدكتور
    </button>
  </header>

  <!-- ===== Content ===== -->
  <div class="container">

    <!-- Statistics -->
    <div class="stats">
      <div class="card">
        <h3>عدد المحاضرات</h3>
        <div class="value" id="lecturesCount">1</div>
      </div>

      <div class="card">
        <h3>عدد الطلاب</h3>
        <div class="value" id="studentsCount">0</div>
      </div>

      <div class="card">
        <h3>نسبة الحضور</h3>
        <div class="value">—%</div>
      </div>
    </div>

    <!-- Lectures Table -->
    <h3 style="margin-bottom:10px;">المحاضرات</h3>

    <table>
      <thead>
        <tr>
          <th>LectureID</th>
          <th>المقرر</th>
          <th>الشعبة</th>
          <th>البداية</th>
          <th>النهاية</th>
        </tr>
      </thead>
      <tbody id="lecturesTable">
        <tr>
          <td>L1770473077502</td>
          <td>CS111</td>
          <td>1</td>
          <td>07/02/2026 17:04</td>
          <td>21/02/2026 17:04</td>
        </tr>
      </tbody>
    </table>

  </div>

  <!-- ===== Footer ===== -->
  <footer>
    Hather Attendance System © 2026
  </footer>

  <!-- ===== Scripts ===== -->
  <script>
    function goToDoctor() {
      window.location.href = "doctor.html";
    }
  </script>

</body>
</html>
